/* ---------- diverging ranked bars ---------- */
function divergingBars(host,rows,key,unit,dp,goodIsPositive){
  var W=760,rowH=23,L=124,R=56,T=6,B=24,n=rows.length,H=T+B+n*rowH,pw=W-L-R;
  var vals=rows.map(function(r){return r[key]});

  var x0=L+pw/2,xs=function(v){return x0+v/mx*(pw/2)};
  var box=h("div","chart-box");
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"per-country estimates"});
  ticks(-mx,mx,4).forEach(function(tv){
    svg.appendChild(el("line",{x1:xs(tv),x2:xs(tv),y1:T,y2:T+n*rowH},"stroke:var(--grid);stroke-width:1"));
    var t=el("text",{x:xs(tv),y:H-8,"text-anchor":"middle"},"fill:var(--text-muted);font-size:10.5px;font-variant-numeric:tabular-nums");
    t.textContent=fmt(tv,0);svg.appendChild(t)});
  svg.appendChild(el("line",{x1:x0,x2:x0,y1:T,y2:T+n*rowH},"stroke:var(--baseline);stroke-width:1"));
  rows.forEach(function(r,i){
    var v=r[key],y=T+i*rowH,bh=14,good=goodIsPositive?v>0:v<0;
    var xa=Math.min(x0,xs(v)),bw=Math.max(2,Math.abs(xs(v)-x0)),rr=Math.min(4,bh/2,bw/2);
    var d=v>=0
      ? "M"+xa+","+y+" L"+(xa+bw-rr)+","+y+" Q"+(xa+bw)+","+y+" "+(xa+bw)+","+(y+rr)+" L"+(xa+bw)+","+(y+bh-rr)+" Q"+(xa+bw)+","+(y+bh)+" "+(xa+bw-rr)+","+(y+bh)+" L"+xa+","+(y+bh)+" Z"
      : "M"+(xa+bw)+","+y+" L"+(xa+rr)+","+y+" Q"+xa+","+y+" "+xa+","+(y+rr)+" L"+xa+","+(y+bh-rr)+" Q"+xa+","+(y+bh)+" "+(xa+rr)+","+(y+bh)+" L"+(xa+bw)+","+(y+bh)+" Z";
    svg.appendChild(el("path",{d:d},"fill:var("+(good?"--series-1":"--neg")+")"));
    var nm=el("text",{x:L-10,y:y+bh-3,"text-anchor":"end"},"fill:var(--text-primary);font-size:11.5px");
    nm.textContent=r.name;svg.appendChild(nm);

    vl.textContent=fmt(v,dp)+unit;svg.appendChild(vl);

  box.appendChild(svg);host.appendChild(box);
}

/* ---------- convergence scatter with fitted line ---------- */
function convScatter(host,fit,treated){
  var W=760,H=330,L=54,R=18,T=14,B=42,pw=W-L-R,ph=H-T-B;
  var pts=fit.points.slice();
  var xsAll=pts.map(function(p){return p.level}).concat(treated.map(function(t){return t.level}));
  var ysAll=pts.map(function(p){return p.growth}).concat(treated.map(function(t){return t.actual}));
  var xlo=Math.min.apply(null,xsAll)*0.9,xhi=Math.max.apply(null,xsAll)*1.05;
  var ylo=Math.min.apply(null,ysAll)-8,yhi=Math.max.apply(null,ysAll)+8;
  var xs=function(v){return L+(v-xlo)/(xhi-xlo)*pw},ys=function(v){return T+(yhi-v)/(yhi-ylo)*ph};
  var box=h("div");
  var lg=h("div","legend");
  [["Non-members (fit the line)","var(--series-2)"],["EU members","var(--series-1)"]].forEach(function(k){
    var e=h("span","key");var i=document.createElement("i");i.className="dot";i.style.background=k[1];
    e.appendChild(i);e.appendChild(document.createTextNode(k[0]));lg.appendChild(e)});
  box.appendChild(lg);
  var root=h("div","chart-box");box.appendChild(root);
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"growth against starting income"});
  ticks(ylo,yhi,5).forEach(function(tv){
    svg.appendChild(el("line",{x1:L,x2:W-R,y1:ys(tv),y2:ys(tv)},"stroke:var(--grid);stroke-width:1"));
    var t=el("text",{x:L-7,y:ys(tv)+3.5,"text-anchor":"end"},"fill:var(--text-muted);font-size:10.5px;font-variant-numeric:tabular-nums");
    t.textContent=fmt(tv,0);svg.appendChild(t)});
  ticks(xlo,xhi,5).forEach(function(tv){
    var t=el("text",{x:xs(tv),y:H-22,"text-anchor":"middle"},"fill:var(--text-muted);font-size:10.5px;font-variant-numeric:tabular-nums");
    t.textContent=Math.round(tv)+"%";svg.appendChild(t)});
  var ax=el("text",{x:L+pw/2,y:H-6,"text-anchor":"middle"},"fill:var(--text-muted);font-size:10.5px");
  ax.textContent="income before accession, % of EU average";svg.appendChild(ax);
  // fitted line
  svg.appendChild(el("line",{x1:xs(xlo),y1:ys(fit.a+fit.b*xlo),x2:xs(xhi),y2:ys(fit.a+fit.b*xhi)},
    "stroke:var(--series-2);stroke-width:2;opacity:0.55"));
  var root2=root;
  var tt=h("div","tooltip");
  function mark(x,y,color,name,sub){
    var g=el("g",{tabindex:"0"});
    g.appendChild(el("circle",{cx:xs(x),cy:ys(y),r:5},"fill:var("+color+");stroke:var(--surface-1);stroke-width:2"));
    g.appendChild(el("circle",{cx:xs(x),cy:ys(y),r:14},"fill:transparent"));
    function show(){while(tt.firstChild)tt.removeChild(tt.firstChild);
      var a=h("div","tt-title");a.textContent=name;tt.appendChild(a);
      var b=h("div","tt-val");b.textContent=sub;tt.appendChild(b);
      tt.style.display="block";
      var rect=root2.getBoundingClientRect();
      var px=(xs(x)/W)*rect.width,py=(ys(y)/H)*rect.height;
      var left=px+14;if(left+tt.offsetWidth>rect.width-4)left=px-tt.offsetWidth-14;
      tt.style.left=Math.max(2,left)+"px";tt.style.top=Math.max(2,py-10)+"px"}
    g.addEventListener("pointerenter",show);g.addEventListener("focus",show);
    g.addEventListener("pointerleave",function(){tt.style.display="none"});
    g.addEventListener("blur",function(){tt.style.display="none"});
    svg.appendChild(g);
  }
  pts.forEach(function(p){mark(p.level,p.growth,"--series-2",p.name,
    "started at "+p.level+"% of EU · grew "+fmt(p.growth,0)+"%")});
  treated.forEach(function(t){mark(t.level,t.actual,"--series-1",t.name,
    "started at "+t.level+"% of EU · grew "+fmt(t.actual,0)+"% · "+fmt(t.excess,1)+"% vs the line")});
  root.appendChild(svg);root.appendChild(tt);
  host.appendChild(box);
  host.appendChild(h("p","note","The orange line is fitted through non-members only — it is what "
    +"catch-up growth looked like <em>without</em> EU membership. A member above the line grew faster than its "
    +"starting position predicted; below it, slower. Fit: slope "+fit.b.toFixed(3)
    +" growth points per point of starting income, r² = "+fit.r2+", from "+fit.n+" non-members."));
}

/* ---------- estimate cards ---------- */
function estCard(label,val,unit,dp,ci,goodIsPositive,n){
  var e=h("div","est");
  e.appendChild(h("div","lbl",label));
  e.appendChild(h("div","val",val===null?"–":fmt(val,dp)+unit));
  if(ci){
    e.appendChild(h("div","ci","95% interval "+fmt(ci.lo,1)+unit+" to "+fmt(ci.hi,1)+unit+" · n="+n));
    var v=h("div","verdict "+(ci.crossesZero?"zero":"sig"));
    v.textContent=ci.crossesZero
      ? "Interval spans zero — not distinguishable from no effect at this confidence level."
      : "Interval excludes zero — a difference this size is unlikely to be chance alone.";
    e.appendChild(v);
  } else if(n!==undefined){
    e.appendChild(h("div","ci","n="+n+" — too few countries for an interval"));
  }
  return e;
}

      var cn=h("p","");
      cn.innerHTML="<strong>Controls:</strong> "+(P.controlsByBloc[bloc].length?P.controlsByBloc[bloc].join(", "):"none available");
      cv.appendChild(cn);
    });
    cv.appendChild(h("p","note","The South bloc has no non-member control group at all — there is no comparable Mediterranean or post-authoritarian European country that stayed outside the Union. Greece, Portugal and Spain can be described but not tested by this method."));
    sec.appendChild(cv);
  }
});

tabsEl.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  tabsEl.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});
  panelsEl.querySelectorAll("section.panel").forEach(function(p){p.classList.remove("active")});
  document.getElementById("panel-"+b.dataset.tab).classList.add("active");
});
var modes=["auto","light","dark"],mi=0,btn=document.getElementById("themeBtn");
btn.addEventListener("click",function(){mi=(mi+1)%3;var m=modes[mi];
  if(m==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",m);
  btn.textContent="Theme: "+m});
})();
</script>
