    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);

    --band: rgba(57,135,229,0.10); --tooltip-bg: #242423;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 24px 20px 48px; }
  .wrap { max-width: 1060px; margin: 0 auto; }

  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; max-width: 660px; line-height: 1.5; }
  .theme-btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .theme-btn:hover { color: var(--text-primary); }

  nav.tabs { display: flex; gap: 4px; margin: 20px 0 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary);
    font-size: 14px; font-weight: 500; padding: 8px 14px 10px; cursor: pointer; font-family: inherit; }
  nav.tabs button:hover { color: var(--text-primary); }
  nav.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); font-weight: 600; }

  section.panel { display: none; }
  section.panel.active { display: block; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .tile .label { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .tile .delta { font-size: 12.5px; margin-top: 6px; color: var(--text-secondary); }
  .tile .delta strong { color: var(--text-primary); font-weight: 600; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 780px) { .grid2 { grid-template-columns: 1fr; } }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 18px 12px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; font-weight: 600; }
  .card .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; margin-bottom: 10px; line-height: 1.45; }
  .card.prose { padding-bottom: 18px; }
  .card.prose p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px; }
  .card.prose p strong { color: var(--text-primary); font-weight: 600; }

  .legend { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .legend .key { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .key .swatch-line { width: 16px; height: 2px; border-radius: 1px; }

  .chart-box { position: relative; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .tooltip { position: absolute; pointer-events: none; display: none; z-index: 5; background: var(--tooltip-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); min-width: 120px; }
  .tooltip .tt-title { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .tt-key { width: 10px; height: 2px; border-radius: 1px; flex: none; }
  .tooltip .tt-val { font-weight: 600; color: var(--text-primary); }
  .tooltip .tt-name { color: var(--text-secondary); }

  details.data-table { margin-top: 4px; }
  details.data-table summary { font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 6px 0; }
  details.data-table summary:hover { color: var(--text-primary); }
  details.data-table table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0 10px; }
  details.data-table th, details.data-table td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid);

  details.data-table th { color: var(--text-muted); font-weight: 500; }

  .timeline { list-style: none; margin-top: 6px; }
  .timeline li { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
  .timeline li:last-child { border-bottom: none; }
  .timeline .tdate { flex: none; width: 96px; font-size: 12.5px; color: var(--text-muted);

  .timeline .tbody { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  table.t th, table.t td { padding: 5px 8px; border-bottom: 1px solid var(--grid);
    color: var(--text-secondary); text-align: left; }
  table.t th { color: var(--text-muted); font-weight: 500; }
  table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.t td.nm { color: var(--text-primary); font-weight: 500; }
  .timeline.disputes li { padding: 13px 0; align-items: flex-start; }

  .timeline .outcome { display: inline-block; margin-top: 5px; color: var(--text-primary); }
  .timeline .src { display: inline-block; margin-top: 4px; font-size: 11.5px; color: var(--text-muted); }

  .vlabel { display: block; font-size: 23px; font-weight: 650; letter-spacing: -0.01em;

  .vrow { border-top: 1px solid var(--grid); padding: 11px 0 3px; }

  .vnote { font-size: 12px; color: var(--text-muted); line-height: 1.55; margin-top: 4px;

  .tl-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--series-1); margin-top: 6px; }

, 28.7, 26.2, 26.8, 26.8, 25.4, 27.8, 26.8, 27.2, 26.1, 26.6, 26.8, null, null, null, null, null, null], "ISL|DERIVED.NETM.P1000": [-1.46, 0.971, -1.78, -5.364, -4.865, -3.494, -2.534, -2.757, 0.68, 2.634, 0.717, -1.369, -2.601, -1.378, 3.84, 6.295, -3.931, -3.81, 4.441, -0.862, -0.736, -3.022, -5.062, -1.9, 0.83, 3.7, 4.2, 6.675, 3.042, -1.158, -0.705, 2.089, 13.227, 17.447, 16.863, 3.585, -15.024, -6.461, -4.367, -0.864, 5.146, 3.479, 4.531, 12.306, 24.31, 18.819, 13.95, 6.817, 13.183, 17.107, 12.005, 9.167, 6.904]}, "kpis": [{"label": "GNI per capita (PPP), vs EU average", "delta": "World Bank · not a member, shown against the EU average", "value": "128%"}, {"label": "GNI per capita, PPP", "delta": "current international $ · World Bank", "value": "83,250"}, {"label": "Unemployment (ILO)", "delta": "% of labour force · World Bank", "value": "3.6%"}, {"label": "Trade openness", "delta": "exports + imports, % of GDP · World Bank", "value": "82%"}], "heroChart": {"title": "Income relative to the EU average", "sub": "GNI per capita at purchasing-power parity as a share of the EU-wide average. GNI rather than GDP, because GDP overstates income in economies where a lot of output accrues to non-residents. The 2008 collapse is the largest single movement on this page: 128% of the EU average in 2007, 104% by 2010. Iceland's EU application followed it by nine months, and the application was suspended once the economy had recovered — which is why this country's position on membership is hard to read off its income line.", "series": [{"code": "DERIVED.GNI.PCT.EU", "name": "Iceland, % of EU average"}], "opts": {"unit": "%", "dp": 1, "area": true}}, "tabs": {"legal": [{"type": "prose", "title": "Legal", "paras": ["Iceland is <strong>not bound by the EU treaties<\/strong>, and is bound by a great deal of EU law anyway. The EEA Agreement, in force since 1 January 1994, extends the single market's rules on goods, services, capital and labour — together with competition, state aid, consumer protection, employment and environmental law — to Iceland without giving it a vote on any of them. This is the arrangement usually described from inside the Union as rule-taking.", "Outside the EEA's reach: the common agricultural and fisheries policies, the customs union and common external tariff, the common commercial policy, monetary union, and justice and home affairs beyond what Schengen covers.", "Schengen has applied since <strong>2001<\/strong>, so border checks with the Union are gone even though the border itself is a customs border. Iceland is a member of EFTA and disputes under the EEA go to the EFTA Court rather than the Court of Justice of the EU.", "<em>Detailed legal analysis — how much of the acquis actually applies, and how EEA law is incorporated domestically — is pending.<\/em>"]}, {"title": "Rule of law", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Both of these countries sit near the top of this scale throughout, which is the headroom problem the governance estimates run into everywhere in this project.", "series": [{"code": "WGI.RL.EST", "name": "Rule of law"}], "opts": {"unit": "", "dp": 2, "zero": true}, "type": "chart"}], "financial": [{"type": "prose", "title": "Financial", "paras": ["The same World Bank series collected for every member state. Two charts that appear on member pages are absent here and cannot be filled in: EU budget flows, because a non-member neither pays into the budget nor receives from it, and the Eurostat long-term bond series, which is a euro-convergence indicator collected for member states only."]}, {"type": "chartRow", "charts": [{"title": "Real GDP growth, %", "sub": "Annual change in real GDP.", "series": [{"code": "NY.GDP.MKTP.KD.ZG", "name": "Real GDP growth"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "Unemployment, % of labour force", "sub": "ILO-modelled estimate.", "series": [{"code": "SL.UEM.TOTL.ZS", "name": "Unemployment"}], "opts": {"unit": "%", "dp": 1}}]}, {"type": "chartRow", "charts": [{"title": "GNI per capita, PPP vs the EU average", "sub": "Current international $. The EU aggregate is available from 1996.", "series": [{"iso3": "EUU", "code": "NY.GNP.PCAP.PP.CD", "name": "EU average", "colorVar": "--series-2"}, {"code": "NY.GNP.PCAP.PP.CD", "name": "Iceland"}], "opts": {"unit": " $", "dp": 0, "endLabelBelow": 2}}, {"title": "Real income per head, % of the EU average", "sub": "Constant 2015 US$, so this one is not moved by exchange rates or inflation — useful as a cross-check on the headline chart.", "series": [{"code": "DERIVED.KD.PCT.EU", "name": "% of EU average"}], "opts": {"unit": "%", "dp": 1}}]}], "commercial": [{"type": "prose", "title": "Commercial", "paras": ["Trade openness is the outcome this project can establish causally for EU members, and it is also the one where the EEA does most of its work: these countries are inside the single market for goods and services without being inside the Union. Read these lines as the counterfactual the trade estimate is measured against."]}, {"title": "Trade in goods &amp; services, % of GDP", "sub": "Exports and imports of goods and services.", "series": [{"code": "NE.EXP.GNFS.ZS", "name": "Exports"}, {"code": "NE.IMP.GNFS.ZS", "name": "Imports", "colorVar": "--series-2"}], "opts": {"unit": "%", "dp": 1, "endLabelBelow": 2}, "type": "chart"}, {"type": "chartRow", "charts": [{"title": "FDI net inflows, % of GDP", "sub": "Foreign direct investment, net inflows.", "series": [{"code": "BX.KLT.DINV.WD.GD.ZS", "name": "FDI net inflows"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "International arrivals, millions", "sub": "World Bank / UNWTO border arrivals. Series generally ends 2019–2020.", "series": [{"code": "ST.INT.ARVL", "name": "Arrivals"}], "opts": {"unit": "m", "dp": 1, "scale": 1e-06}}]}], "political": [{"type": "kpis", "items": [{"label": "Althingi calls a referendum", "value": "28 May 2026", "delta": "Parliament approves the foreign minister's resolution putting the question of resuming accession negotiations to a natio"}, {"label": "Advisory referendum scheduled", "value": "29 Aug 2026", "delta": "\"Should Iceland begin membership negotiations with the European Union anew?\" The vote is advisory under Icelandic electo"}]}, {"type": "prose", "title": "Political", "paras": ["The verified timeline is on the Overview tab. Applied in 2009 after the banking collapse, suspended talks in 2013, and holds an advisory referendum on resuming them on 29 August 2026.", "The political question here is the mirror of the one every member page asks. A member page asks what joining did. This one asks what staying out did — and that is a counterfactual about a country that never entered, which no comparison of observed outcomes can supply. See the panel at the top of the Overview tab."]}, {"type": "chartRow", "charts": [{"title": "Voice and accountability", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts.", "series": [{"code": "WGI.VA.EST", "name": "Voice and accountability"}], "opts": {"unit": "", "dp": 2, "zero": true}}, {"title": "Control of corruption", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Higher is better.", "series": [{"code": "WGI.CC.EST", "name": "Control of corruption"}], "opts": {"unit": "", "dp": 2, "zero": true}}]}], "social": [{"type": "prose", "title": "Social", "paras": ["Free movement of people applies here through the EEA and Schengen exactly as it does inside the Union, so the migration series is not measuring a difference in regime."]}, {"title": "Net migration, thousands of people", "sub": "UN World Population Prospects estimates via World Bank. Blue = net inflow, red = net outflow.", "series": [{"code": "SM.POP.NETM", "name": "Net migration"}], "opts": {"type": "bar", "unit": "k", "dp": 1, "zero": true, "scale": 0.001}, "type": "chart"}, {"type": "chartRow", "charts": [{"title": "Income inequality (Gini index)", "sub": "World Bank estimate (0 = perfect equality). Survey-based, so gaps mean no survey rather than no change.", "series": [{"code": "SI.POV.GINI", "name": "Gini index"}], "opts": {"unit": "", "dp": 1}}, {"title": "Net migration per 1,000 residents", "sub": "The same flow scaled by population, which is the comparable form.", "series": [{"code": "DERIVED.NETM.P1000", "name": "Net migration per 1,000"}], "opts": {"unit": "", "dp": 1, "zero": true}}]}]}, "sources": [{"label": "Time series", "text": "World Bank Open Data (api.worldbank.org). Indicator codes travel with every value in <code class=\"ind\">data/indicators.csv<\/code>."}, {"label": "Milestones", "text": "Statistics Norway, the Norwegian Government, the Council of the EU, the European Commission (DG NEAR), EFTA, Iceland's National Electoral Commission and RÚV. The source for each row is recorded in <code class=\"ind\">data/milestones.csv<\/code>, and where two credited sources disagree the row says so rather than picking one."}, {"label": "Relationship metadata", "text": "EEA, Schengen and EFTA status in <code class=\"ind\">data/nonmembers.csv<\/code>."}], "method": [{"title": "Why this page exists", "text": "Iceland is one of the non-member countries every estimate in this project is measured against. A control group that is never shown is a control group nobody can check."}, {"title": "What is missing, and why", "text": "EU budget flows and the Eurostat bond series are absent because they do not exist for a non-member — not because collection failed. Everything else on a member page is here."}, {"title": "The EEA changes what the comparison means", "text": "Both non-member profiles in this set are inside the single market through the EEA. So the contrast with a member state is <em>not<\/em> integration against isolation; it is integration without membership against integration with it. That makes them a demanding control, and it is one reason the trade estimate for the Western bloc does not survive its checks."}, {"title": "Attribution caution", "text": "Nothing on this page shows what not joining caused. That would need a counterfactual for a country that never entered, which this design cannot produce."}], "milestones": [{"date": "1 Jan 1973", "sort": 1973.0, "label": "Free trade agreement with the EEC", "description": "Bilateral agreement removing tariffs on industrial goods", "kind": "legal", "scope": "country"}, {"date": "1 Jan 1993", "sort": 1993.0, "label": "Single market begins", "description": "The four freedoms — goods, services, capital and people — take effect across the Community", "kind": "era", "scope": "eu"}, {"date": "1 Nov 1993", "sort": 1993.83, "label": "Maastricht Treaty in force", "description": "The European Union is created; the treaty sets the convergence criteria for a single currency", "kind": "legal", "scope": "eu"}, {"date": "1 Jan 1994", "sort": 1994.0, "label": "EEA Agreement in force", "description": "Iceland enters the single market as a non-member. Fisheries stay outside, which is the central reason membership has never been settled here", "kind": "era", "scope": "country"}, {"date": "1 Jan 1995", "sort": 1995.0, "label": "EFTA enlargement", "description": "Austria Finland and Sweden join; Norway's electorate votes no", "kind": "era", "scope": "eu"}, {"date": "26 Mar 1995", "sort": 1995.23, "label": "Schengen Convention applied", "description": "Border checks abolished between the first seven participating states", "kind": "legal", "scope": "eu"}, {"date": "1 Jan 1999", "sort": 1999.0, "label": "Euro introduced", "description": "Exchange rates irrevocably fixed for eleven member states; the currency exists in accounting form only", "kind": "era", "scope": "eu"}, {"date": "25 Mar 2001", "sort": 2001.23, "label": "Schengen applied", "description": "Border checks lifted with the Schengen area, together with Norway and the Nordic EU members", "kind": "legal", "scope": "country"}, {"date": "1 Jan 2002", "sort": 2002.0, "label": "Euro notes and coins", "description": "Physical currency replaces twelve national currencies", "kind": "era", "scope": "eu"}, {"date": "1 May 2004", "sort": 2004.33, "label": "Enlargement to ten", "description": "Cyprus Czechia Estonia Hungary Latvia Lithuania Malta Poland Slovakia and Slovenia join in the largest single enlargement", "kind": "era", "scope": "eu"}, {"date": "1 Jan 2007", "sort": 2007.0, "label": "Bulgaria and Romania join", "description": "Fifth enlargement completed", "kind": "era", "scope": "eu"}, {"date": "Oct 2008", "sort": 2008.77, "label": "Banking collapse", "description": "All three major banks — Landsbanki, Glitnir and Kaupthing — failed or were taken into resolution within a few days, after the state took a partial stake in Glitnir on 29 September. Two credited government sources disagree by about a day on each bank, so no single dates are given", "kind": "warn", "scope": "country"}, {"date": "17 Jul 2009", "sort": 2009.54, "label": "Membership application submitted", "description": "The Althingi voted to apply on 16 July, 33 to 28 with 2 abstentions; the application was delivered the following day to Sweden, then holding the Council presidency", "kind": "political", "scope": "country"}, {"date": "1 Dec 2009", "sort": 2009.92, "label": "Lisbon Treaty in force", "description": "Extends qualified-majority voting, gives the Charter of Fundamental Rights binding force and creates the European Council presidency", "kind": "legal", "scope": "eu"}, {"date": "2 May 2010", "sort": 2010.33, "label": "First Greek adjustment programme", "description": "Euro-area states and the IMF agree EUR 110bn in loans; the euro-area sovereign debt crisis begins", "kind": "warn", "scope": "eu"}, {"date": "17 Jun 2010", "         svg.appendChild(el("path", { d: d, fill: "none" }, "stroke:var(" + s.colorVar + ");stroke-width:2;stroke-linejoin:round;stroke-linecap:round"));
        var li = s.values.length - 1; while (s.values[li] === null) li--;
        svg.appendChild(el("circle", { cx: xs(Y0 + li), cy: ys(s.values[li]), r: 4 }, "fill:var(" + s.colorVar + ");stroke:var(--surface-1);stroke-width:2"));
        var below = opts.endLabelBelow && si === (opts.endLabelBelow - 1);
        var ey = ys(s.values[li]) + (below ? 16 : -9);
        /* Two series ending a few hundred euros apart print their end labels on top of one
           another and neither is readable. Push any label that lands within 12px of one
           already placed clear of it, in whichever direction its own line is heading. */

    /* ---- milestone rail ----
       A line bending in 2004 means one thing if that is the year the country joined and

  // ---------------- card builders ----------------

  /* ---------------- the budget, in and out ---------------- */
  function moneyCard(full) {
    var M = P.money;
    if (!M) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "What it pays in, and what comes back"));
    card.appendChild(h("p", "sub", "Cumulative " + M.since + "–" + M.to

      + "<a href=\"flows.html\">Full breakdown for every member state →</a>"));

    var row = h("div", "kpis");
    [["Paid in", "€" + fmt(M.cumOut, 1) + "bn",
      M.perHeadOut === null ? "" : "€" + fmt(M.perHeadOut, 0) + " per person a year"],
     ["Received", "€" + fmt(M.cumIn, 1) + "bn",
      M.perHeadIn === null ? "" : "€" + fmt(M.perHeadIn, 0) + " per person a year"],
     [M.net >= 0 ? "Net receipt" : "Net contribution",
      "€" + fmt(Math.abs(M.net), 1) + "bn",
      (M.pctGniNet === null ? "" : fmt(Math.abs(M.pctGniNet), 2)
        + "% of national income a year")]
    ].forEach(function (k, i) {
      var t = h("div", "tile");
      t.appendChild(h("div", "label", k[0]));
      var v = h("div", "value"); v.textContent = k[1];
      if (i === 2) v.style.color = M.net >= 0 ? "var(--series-1)" : "var(--series-2)";
      t.appendChild(v);
      if (k[2]) t.appendChild(h("div", "delta", k[2]));
      row.appendChild(t);
    });
    card.appendChild(row);

    /* Two bars on one scale: the comparison is the point, and stacking the funds inside
       shows at a glance whether a country's receipts are farm money, cohesion money or
       research money without needing a second chart. */
    var COL = ["#2a78d6", "#5faf7e", "#5aa9a2", "#9cbb52", "#d0ae5c", "#d99a68",
               "#cf8a86", "#b58aa8", "#948fbd", "#7b93c9", "#8a8f9c", "#4f9fc9",
               "#7ab55f", "#bcbb54", "#c9a878"];
    var OCOL = ["#eb6834", "#e08246", "#d59a5e", "#c9a878", "#b0a894"];
    var inP = M.receipts.map(function (r, i) { return { name: r.label, v: r.v, c: COL[i % COL.length] }; });
    var outP = M.payments.filter(function (r) { return r.v > 0; })
      .map(function (r, i) { return { name: r.label, v: r.v, c: OCOL[i % OCOL.length] }; });
    var inPos = inP.reduce(function (a, p) { return a + p.v; }, 0);
    var outPos = outP.reduce(function (a, p) { return a + p.v; }, 0);
    var mx = Math.max(inPos, outPos) || 1;
    var Wb = 760, Lb = 74, Rb = 84, pwb = Wb - Lb - Rb, Hb = 118;
    var rootb = h("div", "chart-box");

    [["Received", inP, inPos, M.cumIn, 14], ["Paid in", outP, outPos, M.cumOut, 66]].forEach(function (r) {
      var lab = el("text", { x: Lb - 10, y: r[4] + 21, "text-anchor": "end" }, "fill:var(--text-secondary);font-size:12.5px");
      lab.textContent = r[0]; svgb.appendChild(lab);
      var run = 0;
      r[1].forEach(function (p) {
        var seg = p.v / mx * pwb;
        if (seg <= 0) return;
        var rect = el("rect", { x: Lb + run, y: r[4], width: seg, height: 32 },

        rect.addEventListener("pointerenter", function () {
          while (ttb.firstChild) ttb.removeChild(ttb.firstChild);
          var a = h("div", "tt-title"); a.textContent = p.name; ttb.appendChild(a);
          var b = h("div", "tt-val"); b.textContent = "€" + fmt(p.v, 1) + "bn"; ttb.appendChild(b);

        });
        rect.addEventListener("pointerleave", function () { ttb.style.display = "none"; });
        svgb.appendChild(rect);
        if (seg > 46) {
          var t = el("text", { x: Lb + run + seg / 2, y: r[4] + 21, "text-anchor": "middle" },
            "fill:#fff;font-size:11px;font-weight:600;pointer-events:none;font-variant-numeric:tabular-nums");

        }

      var tot = el("text", { x: Lb + r[2] / mx * pwb + 7, y: r[4] + 21 },
        "fill:var(--text-primary);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums");

      var tb = document.createElement("table");
      var hr = document.createElement("tr");
      ["Line", "€bn", "Share"].forEach(function (x) {
        var th = document.createElement("th"); th.textContent = x; hr.appendChild(th);
      });
      tb.appendChild(hr);
      [["Received", M.receipts, M.cumIn], ["Paid in", M.payments, M.cumOut]].forEach(function (grp) {
        var hd = document.createElement("tr");
        var td = document.createElement("td"); td.colSpan = 3;

  /* ---------------- what a non-member pays and gets back ----------------
     There is no budget workbook for a country outside the Union, and the absence is the
     point: nobody publishes an audited net position for a non-member. The rows below are
     what IS published, on the basis each source publishes it, and they are deliberately
     not summed. */
  function flowsCard() {
    var F = P.flows;
    if (!F) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "What it pays the Union, and what it gets back"));
    card.appendChild(h("p", "sub", "A non-member has no seat in the EU budget, so there is no "
      + "equivalent of the Commission workbook that every member page draws on. What follows is "
      + "each figure as its own source publishes it."));

    function tbl(rows, heading) {
      if (!rows.length) return;
      card.appendChild(h("h4", null, heading));
      var t = h("table", "t");
      var hr = document.createElement("tr");
      ["Item", "Amount", "Basis", "Period"].forEach(function (x, j) {
        var th = document.createElement("th"); if (j === 1) th.className = "num";
        th.textContent = x; hr.appendChild(th);
      });
      t.appendChild(hr);
      rows.forEach(function (r) {
        var tr = document.createElement("tr");
        var unit = r.currency.split(" ");          // "EUR m" -> ["EUR","m"]
        var amt = (unit[0] === "%")
          ? r.amount + "%"
          : unit[0] + " " + Number(r.amount).toLocaleString("en-US") + (unit[1] || "");
        [[r.label, "nm"], [amt, "num"], [r.basis, ""], [r.period, ""]]
          .forEach(function (c) {
            var td = document.createElement("td"); td.className = c[1];
            td.textContent = c[0]; tr.appendChild(td);
          });
        t.appendChild(tr);
        var d = document.createElement("tr");
        var dt = document.createElement("td"); dt.colSpan = 4; dt.className = "warnrow";
        dt.textContent = r.detail + " — " + r.source;
        d.appendChild(dt); t.appendChild(d);
      });
      card.appendChild(t);
    }
    tbl(F.out, "Paid");
    tbl(F["in"], "Received");

    card.appendChild(h("p", "note", "<strong>These are not added up, and that is deliberate.</strong> "
      + "They sit on different bases — some are annual averages, some are totals for a whole "
      + "funding period, and two currencies are involved. No institution publishes a single "
      + "audited net position for a non-member the way the Commission does for a member state, "
      + "and constructing one here by summing across bases would produce a number that looks "
      + "authoritative and is not. The comparison a reader wants — what this country pays "
      + "against what a member of the same size pays — cannot be made from published figures "
      + "at the standard this project holds itself to."));

  }

      }
      var mc = h("div", "card");
      mc.appendChild(h("h3", null, "Milestones at a glance"));
      mc.appendChild(h("p", "sub", "This country's own events, and the Union-wide ones it "
        + "lived through. The same events are marked on the rail under every chart, so a "
        + "bend in a line can be read against what happened that year. It starts in "
        + P.window.start + ", the first year any chart on this page has data for; anything "
        + "earlier is listed at the foot of the list rather than plotted against nothing."));
      var lgm = h("div", "legend");
      var lgk = [["--series-1", "This country"], ["--text-muted", "EU-wide"]];
      if ((P.disputes || []).length) lgk.push(["--neg", "Point of contention"]);
      lgk.forEach(function (k) {
        var key = h("span", "key");
        var sw = h("span", "swatch-line");
        sw.style.background = "var(" + k[0] + ")";
        sw.style.height = "9px"; sw.style.width = "9px"; sw.style.borderRadius = "50%";
        key.appendChild(sw); key.appendChild(document.createTextNode(k[1]));
        lgm.appendChild(key);
      });
      mc.appendChild(lgm);
      var ul = h("ul", "timeline");
      P.milestones.filter(function (m) { return m.scope !== "dispute"; }).forEach(function (m) {
        var li = document.createElement("li");
        li.className = (m.kind === "era" ? "era " : "") + "scope-" + m.scope;
        li.appendChild(h("span", "tdate", m.date));
        li.appendChild(h("span", "tl-dot" + (m.kind === "warn" ? " warn" : "")
          + (m.scope === "eu" ? " eu" : "")));
        li.appendChild(h("span", "tbody", "<strong>" + m.label + "</strong> — " + m.description
          + (m.scope === "eu" ? " <span class=\"tag\">EU-wide</span>" : "")));
        ul.appendChild(li);
      });
      mc.appendChild(ul);
      if ((P.milestonesDropped || []).length) {
        mc.appendChild(h("p", "note", (P.milestonesDropped.length === 1 ? "One earlier event falls"
          : P.milestonesDropped.length + " earlier events fall")
          + " outside the range this page has data for and are not listed: "
          + P.milestonesDropped.map(function (d) { return d.label + " (" + d.date + ")"; }).join("; ")
          + "."));
      }
      sec.appendChild(mc);
    } else if (t.id === "financial") {
      var fm = moneyCard(true); if (fm) sec.appendChild(fm);
      buildBlocks(sec, P.tabs[t.id] || []);
    } else if (t.id === "sources") {
      var sc = h("div", "card prose");
      sc.appendChild(h("h3", null, "Sources"));
      var sl = h("div", "src-list");
      P.sources.forEach(function (s) { sl.appendChild(h("p", null, "<strong>" + s.label + "</strong> — " + s.text)); });
      sc.appendChild(sl);
      sec.appendChild(sc);
      var mcd = h("div", "card prose");
      mcd.appendChild(h("h3", null, "Method &amp; confidence notes"));
      P.method.forEach(function (m) { mcd.appendChild(h("p", null, "<strong>" + m.title + ".</strong> " + m.text)); });
      sec.appendChild(mcd);
    } else {
      buildBlocks(sec, P.tabs[t.id] || []);
    }
  });

  tabsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    tabsEl.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
    panelsEl.querySelectorAll("section.panel").forEach(function (p) { p.classList.remove("active"); });
    document.getElementById("panel-" + b.dataset.tab).classList.add("active");
  });

  var modes = ["auto", "light", "dark"], mi = 0, btn = document.getElementById("themeBtn");
  btn.addEventListener("click", function () {
    mi = (mi + 1) % 3;
    var m = modes[mi];
    if (m === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", m);
    btn.textContent = "Theme: " + m;
  });
})();
</script>
</body>
</html>
