null, 31.0, 31.6, 34.4, 33.3, null, null, null, 35.1, 36.5, 36.4, 39.0, 35.6, 37.5, 37.2, 35.9, 35.0, 35.8, 35.2, 35.5, 35.1, 34.2, 34.3, 35.6, 35.1, 34.5, 35.7, 34.3, 33.7, 34.0, null, null], "LVA|DERIVED.NETM.P1000": [-12.841, -8.508, -5.347, -4.024, -3.775, -2.284, -1.351, -6.622, -7.973, -3.965, -4.992, -6.688, -4.973, -4.152, -3.648, -10.309, -16.252, -17.224, -9.808, -5.857, -7.148, -4.413, -5.475, -6.291, -4.05, -2.58, -1.785, -1.656, -0.149, 11.72, 4.229, -1.192, -3.967]}, "kpis": [{"label": "GDP per capita (PPP), vs EU average", "delta": "World Bank, latest available year", "value": "70%"}, {"label": "GDP per capita, PPP", "delta": "current international $ · World Bank", "value": "46,137"}, {"label": "Unemployment (ILO)", "delta": "% of labour force · World Bank", "value": "6.6%"}, {"label": "Exports, % of GDP", "delta": "goods and services · World Bank", "value": "63%"}], "heroChart": {"title": "Convergence with the EU: GDP per capita (PPP) as % of EU average", "sub": "Income level relative to the EU-wide average, current international $ at purchasing power parity. The EU aggregate series begins in 1996, so this chart starts there regardless of the window above.", "series": [{"code": "DERIVED.PPP.PCT.EU", "name": "Latvia, % of EU average"}], "opts": {"unit": "%", "dp": 1, "area": true}}, "tabs": {"legal": [{"type": "prose", "title": "Legal", "paras": ["Latvia adopted the acquis communautaire as a condition of entry. Negotiations opened 15 February 2000 and EU law has applied directly since <strong>1 May 2004<\/strong>. The sequencing matters for everything else on this page: the heaviest institutional reform happens <em>before<\/em> entry, inside what any before-and-after comparison treats as the baseline. That is one of three biases in this study that push the measured effect of membership toward zero.", "Latvia adopted the euro in <strong>2014<\/strong>, transferring monetary policy to the ECB, and joined the Schengen area in <strong>2007<\/strong>.", "On the World Bank's rule-of-law estimate Latvia reads <strong>+1.09<\/strong> at 2024 against +0.06 at 1996, ranking 14th of 28 members. Two cautions travel with that number and both are serious. It is an aggregate of expert perceptions on a bounded −2.5 to +2.5 scale, not a count of legal facts. And because the scale is bounded, a country already near the top has less room to rise — which is why the raw comparison of members against non-members looks negative and, once corrected for that headroom, comes out at +0.04: indistinguishable from zero. <strong>This study finds no measurable effect of membership on the rule of law in either direction.<\/strong>", "<em>What is missing here and would change the picture: infringement proceedings, transposition deficits, preliminary references to the Court of Justice, and Article 7 history. None of it was collected, so this lens rests on one perception index and the treaty dates.<\/em>"]}, {"title": "Rule of law", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Confidence in and abidance by the rules of society: contract enforcement, property rights, police and courts.", "series": [{"code": "WGI.RL.EST", "name": "Rule of law"}], "opts": {"unit": "", "dp": 2, "zero": true}, "type": "chart"}], "financial": [{"type": "prose", "title": "Financial", "paras": ["Measured against a fixed external benchmark — US income per head at purchasing-power parity — Latvia moved from <strong>21.3%<\/strong> of the US level in 2000 to <strong>51.1%<\/strong> in 2025, a change of +29.8 points. That ranks <strong>6th of 28<\/strong> member states. The share of the EU average is deliberately not used for this comparison: that denominator rises as poorer members catch up, so a rich country's line falls while its economy grows. Adjusting for the fact that poorer economies converge faster anyway, Latvia came in +4.3 points above what its starting income predicted.", "The deepest single contraction in the record is <strong>1992 (−32.1%)<\/strong> and the strongest year 2006 (+12.8%). Through the three synchronised downturns: 2009 −16.0%, 2012 +7.3%, 2020 −3.5%. The 2012 episode is the one that separates members from non-members in this study — 61% of members contracted that year against 23% of non-members, where 2009 and 2020 hit both groups alike. It is the clearest measurable cost of integration found anywhere here.", "Unemployment peaked at <strong>20.7%<\/strong> in 1996 and stands at 6.6% in 2025. The Eastern bloc's unemployment estimate is a null result — +1.4 points against the non-member controls, an interval of −0.6 to +3.4 that spans zero — so nothing on this line is attributable to accession.", "On the EU budget, Latvia has paid in <strong>€5.2 billion<\/strong> and received <strong>€19.9 billion<\/strong> since 2004, a net receipt of <strong>€14.7 billion<\/strong>. The largest single line coming back is regional and social funds at €7.2 billion. This is the one part of the study that is accounting rather than inference — the figures are the Commission's own and reconcile to its published totals exactly. Note that “received” means expenditure allocated here, not a payment to the government: a research grant to a university and a farm payment to a landowner both count.", "Long-term borrowing costs peaked at <strong>12.36%<\/strong> in 2009 and are 3.27% at 2025. Bond spreads across the euro area collapsed to near zero in the decade after 1999 and reopened violently after 2010, which is the single most visible thing monetary union did to the cost of government borrowing — in both directions."]}, {"type": "chartRow", "charts": [{"title": "Real GDP growth, %", "sub": "Annual change in real GDP.", "series": [{"code": "NY.GDP.MKTP.KD.ZG", "name": "Real GDP growth"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "Inflation (CPI), %", "sub": "Annual consumer-price inflation.", "series": [{"code": "FP.CPI.TOTL.ZG", "name": "CPI inflation"}], "opts": {"unit": "%", "dp": 1, "zero": true}}]}, {"type": "chartRow", "charts": [{"title": "Unemployment, % of labour force", "sub": "ILO-modelled estimate.", "series": [{"code": "SL.UEM.TOTL.ZS", "name": "Unemployment"}], "opts": {"unit": "%", "dp": 1}}, {"title": "GDP per capita, PPP vs EU average", "sub": "Current international $. EU aggregate available from 1996.", "series": [{"iso3": "EUU", "code": "NY.GDP.PCAP.PP.CD", "name": "EU average", "colorVar": "--series-2"}, {"code": "NY.GDP.PCAP.PP.CD", "name": "Latvia"}], "opts": {"unit": " $", "dp": 0, "endLabelBelow": 2}}]}, {"type": "chartRow", "charts": [{"title": "Long-term government bond yield, %", "sub": "Eurostat EMU convergence-criterion series: yield on ten-year government bonds. What this government pays to borrow.", "series": [{"code": "EUROSTAT.IRT_LT_MCBY", "name": "10-year yield"}], "opts": {"unit": "%", "dp": 2}}, {"title": "Net annual earnings, €", "sub": "Single person, no children, on 100% of the average wage. Eurostat flags 2024 as a break in series.", "series": [{"code": "EUROSTAT.EARN_NT_NET", "name": "Net annual earnings"}], "opts": {"unit": " €", "dp": 0}}]}], "commercial": [{"type": "prose", "title": "Commercial", "paras": ["Trade openness — exports plus imports as a share of GDP — moved from <strong>76.2%<\/strong> in 1995 to <strong>129.7%<\/strong> in 2025. Figures above 100% are not an error: a component crossing a border three times is counted three times, which is why small economies inside dense supply chains sit so far above the rest.", "This is the one place the study can make a causal claim. Against non-member neighbours over matched windows, Latvia shows <strong>+21.3 points of GDP<\/strong>. The claim itself is the bloc's rather than this country's: the Eastern estimate is <strong>+20.5 points<\/strong> with 11 of 11 countries positive and a pre-accession placebo of essentially nothing. It is the only outcome here that survives every check applied to it. It does <em>not<\/em> follow that people became better off — that is the income question, and the income question has two answers.", "Direction is a separate question from volume, and the two answers come apart. The share of exports going to the other EU member states was <strong>63.2%<\/strong> in 2002 and <strong>69.3%<\/strong> in 2025. Across the 2004 accession wave that share moved by a median of −0.3 points: the Europe Agreements had already opened free trade with the Community through the 1990s, so membership raised how much these countries traded without changing who with.", "Beyond the Union, the largest destinations in 2025 are <strong>the rest of Europe 16.8%<\/strong>, <strong>Asia 4.8%<\/strong>, <strong>Africa 4.0%<\/strong> of total goods exports. Services are not in this dataset, which matters for economies that sell more services than goods.", "Foreign direct investment peaked at 9.8% of GDP in 2021. Against non-member controls the bloc estimate is −3.1 points of GDP, which survives its checks; this country's own figure is −0.2."]}, {"title": "Trade in goods &amp; services, % of GDP", "sub": "Exports and imports of goods and services.", "series": [{"code": "NE.EXP.GNFS.ZS", "name": "Exports"}, {"code": "NE.IMP.GNFS.ZS", "name": "Imports", "colorVar": "--series-2"}], "opts": {"unit": "%", "dp": 1, "endLabelBelow": 2}, "type": "chart"}, {"title": "Who it trades with: the EU's share", "sub": "Share of this country's total exports and imports going to or coming from the other EU member states. This measures direction, not volume — the charts above show how much a country trades, this one shows who with. Eurostat, EU27 definition applied to every year, so the UK counts as outside throughout.", "series": [{"code": "TRADE.EU.EXP.SHR", "name": "Exports to the EU"}, {"code": "TRADE.EU.IMP.SHR", "name": "Imports from the EU", "colorVar": "--series-2"}], "opts": {"unit": "%", "dp": 1, "endLabelBelow": 2}, "type": "chart"}, {"type": "chartRow", "charts": [{"title": "FDI net inflows, % of GDP", "sub": "Foreign direct investment, net inflows.", "series": [{"code": "BX.KLT.DINV.WD.GD.ZS", "name": "FDI net inflows"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "International arrivals, millions", "sub": "World Bank / UNWTO border arrivals. Series generally ends 2019–2020.", "series": [{"code": "ST.INT.ARVL", "name": "Arrivals"}], "opts": {"unit": "m", "dp": 1, "scale": 1e-06}}]}], "political": [{"type": "prose", "title": "Political", "paras": ["Accession was put to the public here. <strong>Accession referendum (20 Sep 2003)<\/strong> — 67.5% voted yes on a turnout of 71.5%.", "On voice and accountability — participation in choosing a government, plus freedom of expression, association and the press — the estimate moved from +0.47 in 1996 to <strong>+1.13<\/strong> in 2024, a change of +0.66. Same bounded-scale caveat as the rule-of-law figure: compare levels rather than small movements, and treat this as perception rather than fact.", "On control of corruption — higher is better — a rising line means stronger control, not more corruption — the estimate moved from -0.29 in 1996 to <strong>+0.83<\/strong> in 2024, a change of +1.12. Anti-corruption conditionality was an explicit part of accession negotiations for the 2004, 2007 and 2013 waves, which makes this one of the few places a specific mechanism could be tested rather than assumed. It was tested, and the result does not survive: the raw comparison is confounded by headroom on a bounded scale and the corrected estimate cannot be identified.", "The politics of the budget are worth stating plainly, because they are the part most argued about and the least uncertain. Latvia is a net recipient of <strong>€14.7 billion<\/strong> since 2004. Recipients take between two and three percent of national income a year; contributors pay well under one percent of theirs. The Union's budget is about 1% of EU income but concentrated enough to matter enormously at the receiving end.", "<em>Not collected, and it limits this lens: European Parliament turnout, Eurobarometer series on trust and identity, and national parliamentary scrutiny of EU legislation. What is here is two perception indices, the verified milestone record and the budget.<\/em>"]}, {"type": "kpis", "items": [{"label": "Accession referendum", "value": "20 Sep 2003", "delta": "67.5% voted yes on a turnout of 71.5%"}]}, {"type": "prose", "title": "Political", "paras": ["Verified milestones for Latvia are listed on the Overview tab. Written analysis of how membership reshaped the domestic political landscape is pending for this country."]}, {"type": "chartRow", "charts": [{"title": "Voice and accountability", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Participation in selecting government, plus freedom of expression, association and the press.", "series": [{"code": "WGI.VA.EST", "name": "Voice and accountability"}], "opts": {"unit": "", "dp": 2, "zero": true}}, {"title": "Control of corruption", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Higher is better — a rising line means stronger control of corruption, not more of it.", "series": [{"code": "WGI.CC.EST", "name": "Control of corruption"}], "opts": {"unit": "", "dp": 2, "zero": true}}]}], "social": [{"type": "prose", "title": "Social", "paras": ["Population moved −12.9% between 1960 and 2025. This matters more than it looks: income per head is output divided by population, so a shrinking denominator raises the measured figure without anyone becoming better off. Across the Eastern members between 17% and 29% of the measured gain in output per head is the denominator falling — Latvia lost a quarter of its population over the period.", "Net migration         col.appendChild(h("h4", null, side[0]));
        side[1].forEach(function (x) {
          col.appendChild(h("div", "jhead", x.head));
          col.appendChild(h("div", "jbody", x.body));
        });
        g.appendChild(col);
      });
    card.appendChild(g);
    card.appendChild(h("p", "note", J.verdictNote));
    return card;
  }

  /* ---------------- where this country's exports actually go ----------------
     One bar, nine segments, summing to 100. The point of a partition rather than a ranked
     list is that it answers "and the rest?" in the same glance. */
  function destinationsCard() {
    var D = P.destinations;
    if (!D) return null;
    var COL = { EU: "#2a78d6", EUR: "#5aa9a2", ASIA: "#5faf7e", NAMER: "#d0ae5c",
                MEAST: "#d99a68", LATAM: "#cf8a86", AFR: "#b58aa8", OCE: "#948fbd",
                OTHER: "#c3c2b7" };
    var card = h("div", "card");
    card.appendChild(h("h3", null, "Where its exports actually go"));
    card.appendChild(h("p", "sub", "Goods exports by destination region, " + D.year
      + ", as a share of the total. Built by summing every individual trading partner in the "
      + "Commission's COMEXT bilateral data, so the nine shares add to 100 rather than "
      + "overlapping. Hover any segment."));

    var rows = D.rows.slice().sort(function (a, b) { return b.value - a.value; });
    var root = h("div", "chart-box");
    var W = 760, L = 0, R = 0, Hb = 62;
    var svg = el("svg", { viewBox: "0 0 " + W + " " + Hb, role: "img",
      "aria-label": "exports by destination" });
    var tt = h("div", "tooltip");
    var run = 0, total = rows.reduce(function (a, r) { return a + r.value; }, 0) || 100;
    rows.forEach(function (r) {
      var seg = r.value / total * W;
      if (seg <= 0) return;
      var rect = el("rect", { x: run, y: 0, width: seg, height: 38 },
        "fill:" + COL[r.code] + ";stroke:var(--surface-1);stroke-width:1");
      rect.addEventListener("pointerenter", function () {
        while (tt.firstChild) tt.removeChild(tt.firstChild);
        var a = h("div", "tt-title"); a.textContent = r.label; tt.appendChild(a);
        var b = h("div", "tt-val"); b.textContent = fmt(r.value, 1).replace("+", "") + "% of exports";
        tt.appendChild(b);
        tt.style.display = "block"; tt.style.left = "10px"; tt.style.top = "44px";
      });
      rect.addEventListener("pointerleave", function () { tt.style.display = "none"; });
      svg.appendChild(rect);
      if (seg > 52) {
        var t1 = el("text", { x: run + seg / 2, y: 23, "text-anchor": "middle" },
          "fill:#fff;font-size:12px;font-weight:600;pointer-events:none;font-variant-numeric:tabular-nums");
        t1.textContent = r.value.toFixed(r.value >= 10 ? 0 : 1) + "%";
        svg.appendChild(t1);
      }
      if (seg > 76) {
        var t2 = el("text", { x: run + seg / 2, y: 52, "text-anchor": "middle" },
          "fill:var(--text-secondary);font-size:11px;pointer-events:none");
        t2.textContent = r.label;
        svg.appendChild(t2);
      }
      run += seg;
    });
    root.appendChild(svg); root.appendChild(tt);
    card.appendChild(root);

    var tb = h("table", "t");
    var hr = document.createElement("tr");
    ["Destination", "% of exports"].forEach(function (x, j) {
      var th = document.createElement("th"); if (j) th.className = "num";
      th.textContent = x; hr.appendChild(th);
    });
    tb.appendChild(hr);
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      var td = document.createElement("td"); td.className = "nm";
      td.innerHTML = '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;'
        + 'margin-right:7px;background:' + COL[r.code] + '"></span>' + r.label;
      tr.appendChild(td);
      var td2 = document.createElement("td"); td2.className = "num";
      td2.textContent = r.value.toFixed(1) + "%"; tr.appendChild(td2);
      tb.appendChild(tr);
    });
    card.appendChild(tb);
    card.appendChild(h("p", "note", "Goods only — services are not in this dataset, which "
      + "matters for economies that sell more services than goods. “Unallocated” is ships' and "
      + "aircraft stores and partners not specified; it is kept visible rather than "
      + "redistributed, and it is material for the bunkering economies. Regions are UN M49 "
      + "style: Mexico sits in Latin America, not North America. Source: European Commission "
      + "COMEXT, dataset ds-059331."));
    return card;
  }

  function buildBlocks(host, blocks) {
    blocks.forEach(function (b) {
      if (b.type === "prose") host.appendChild(proseCard(b));
      else if (b.type === "kpis") host.appendChild(kpiRow(b.items));
      else if (b.type === "chart") host.appendChild(chartCard(b));
      else if (b.type === "chartRow") {
        var g = h("div", "grid2");
        b.charts.forEach(function (c) { g.appendChild(chartCard(c)); });
        if (b.prose) g.appendChild(proseCard(b.prose));
        host.appendChild(g);
      }
    });
  }

  // ---------------- panels ----------------
  var TABS = [
    { id: "overview", label: "Overview" },
    { id: "legal", label: "Legal" },
    { id: "financial", label: "Financial" },
    { id: "commercial", label: "Commercial" },
    { id: "political", label: "Political" },
    { id: "social", label: "Social" },
    { id: "sources", label: "Sources & method" }
  ];
  var tabsEl = document.getElementById("tabs"), panelsEl = document.getElementById("panels");

  TABS.forEach(function (t, i) {
    var b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.dataset.tab = t.id;
    b.textContent = t.label;
    tabsEl.appendChild(b);

    var sec = h("section", "panel" + (i === 0 ? " active" : ""));
    sec.id = "panel-" + t.id;
    panelsEl.appendChild(sec);

    if (t.id === "overview") {
      sec.appendChild(kpiRow(P.kpis));
      var vc = verdictCard(); if (vc) sec.appendChild(vc);
      sec.appendChild(chartCard(P.heroChart));
      var mnc = moneyCard(false); if (mnc) sec.appendChild(mnc);
      var fc = flowsCard(); if (fc) sec.appendChild(fc);
      var dc = disputesCard(); if (dc) sec.appendChild(dc);
      var ac = acquisCard(); if (ac) sec.appendChild(ac);
      var jc = joiningCard(); if (jc) sec.appendChild(jc);
      if ((P.context || []).length) {
        var cc = h("div", "card prose");
        cc.appendChild(h("h3", null, "Where this country sits in the wider findings"));
        cc.appendChild(h("p", "sub", "Drawn from the cross-country analysis rather than "
          + "written for this page. <a href=\"analysis.html\">The full argument →</a>"));
        P.context.forEach(function (c) {
          cc.appendChild(h("p", null, "<strong>" + c.title + ".</strong> " + c.text));
        });
        sec.appendChild(cc);
      }
      var mc = h("div", "card");
      mc.appendChild(h("h3", null, "Milestones at a glance"));
      mc.appendChild(h("p", "sub", "This country's own events, and the Union-wide ones it "
        + "lived through. The same events are marked on the rail under every chart, so a "
        + "bend in a line can be read against what happened that year. It starts in "
        + P.window.start + ", the first year any chart on this page has data for; anything "
        + "earlier is listed at the foot of the list rather than plotted against nothing."));
      var lgm = h("div", "legend");
      var lgk = [["--series-1", "This country"], ["--text-muted", "EU-wide"]];
      if ((P.disputes || []).length) lgk.push(["--neg", "Point of contention"]);
      lgk.forEach(function (k) {
        var key = h("span", "key");
        var sw = h("span", "swatch-line");
        sw.style.background = "var(" + k[0] + ")";
        sw.style.height = "9px"; sw.style.width = "9px"; sw.style.borderRadius = "50%";
        key.appendChild(sw); key.appendChild(document.createTextNode(k[1]));
        lgm.appendChild(key);
      });
      mc.appendChild(lgm);
      var ul = h("ul", "timeline");
      P.milestones.filter(function (m) { return m.scope !== "dispute"; }).forEach(function (m) {
        var li = document.createElement("li");
        li.className = (m.kind === "era" ? "era " : "") + "scope-" + m.scope;
        li.appendChild(h("span", "tdate", m.date));
        li.appendChild(h("span", "tl-dot" + (m.kind === "warn" ? " warn" : "")
          + (m.scope === "eu" ? " eu" : "")));
        li.appendChild(h("span", "tbody", "<strong>" + m.label + "</strong> — " + m.description
          + (m.scope === "eu" ? " <span class=\"tag\">EU-wide</span>" : "")));
        ul.appendChild(li);
      });
      mc.appendChild(ul);
      if ((P.milestonesDropped || []).length) {
        mc.appendChild(h("p", "note", (P.milestonesDropped.length === 1 ? "One earlier event falls"
          : P.milestonesDropped.length + " earlier events fall")
          + " outside the range this page has data for and are not listed: "
          + P.milestonesDropped.map(function (d) { return d.label + " (" + d.date + ")"; }).join("; ")
          + "."));
      }
      sec.appendChild(mc);
    } else if (t.id === "commercial") {
      var dcx = destinationsCard(); if (dcx) sec.appendChild(dcx);
      buildBlocks(sec, P.tabs[t.id] || []);
    } else if (t.id === "financial") {
      var fm = moneyCard(true); if (fm) sec.appendChild(fm);
      buildBlocks(sec, P.tabs[t.id] || []);
    } else if (t.id === "sources") {
      var sc = h("div", "card prose");
      sc.appendChild(h("h3", null, "Sources"));
      var sl = h("div", "src-list");
      P.sources.forEach(function (s) { sl.appendChild(h("p", null, "<strong>" + s.label + "</strong> — " + s.text)); });
      sc.appendChild(sl);
      sec.appendChild(sc);
      var mcd = h("div", "card prose");
      mcd.appendChild(h("h3", null, "Method &amp; confidence notes"));
      P.method.forEach(function (m) { mcd.appendChild(h("p", null, "<strong>" + m.title + ".</strong> " + m.text)); });
      sec.appendChild(mcd);
    } else {
      buildBlocks(sec, P.tabs[t.id] || []);
    }
  });

  tabsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    tabsEl.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
    panelsEl.querySelectorAll("section.panel").forEach(function (p) { p.classList.remove("active"); });
    document.getElementById("panel-" + b.dataset.tab).classList.add("active");
  });

  var modes = ["auto", "light", "dark"], mi = 0, btn = document.getElementById("themeBtn");
  btn.addEventListener("click", function () {
    mi = (mi + 1) % 3;
    var m = modes[mi];
    if (m === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", m);
    btn.textContent = "Theme: " + m;
  });
})();
</script>
</body>
</html>
