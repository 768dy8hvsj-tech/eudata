  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 24px 20px 48px; }
  .wrap { max-width: 1060px; margin: 0 auto; }

  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; max-width: 660px; line-height: 1.5; }
  .theme-btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);

  .theme-btn:hover { color: var(--text-primary); }

  nav.tabs { display: flex; gap: 4px; margin: 20px 0 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary);
    font-size: 14px; font-weight: 500; padding: 8px 14px 10px; cursor: pointer; font-family: inherit; }
  nav.tabs button:hover { color: var(--text-primary); }
  nav.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); font-weight: 600; }

  section.panel { display: none; }
  section.panel.active { display: block; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .tile .label { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .tile .delta { font-size: 12.5px; margin-top: 6px; color: var(--text-secondary); }
  .tile .delta strong { color: var(--text-primary); font-weight: 600; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 780px) { .grid2 { grid-template-columns: 1fr; } }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 18px 12px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; font-weight: 600; }
  .card .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; margin-bottom: 10px; line-height: 1.45; }
  .card.prose { padding-bottom: 18px; }
  .card.prose p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px; }
  .card.prose p strong { color: var(--text-primary); font-weight: 600; }

  .legend { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .legend .key { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .key .swatch-line { width: 16px; height: 2px; border-radius: 1px; }

  .chart-box { position: relative; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .tooltip { position: absolute; pointer-events: none; display: none; z-index: 5; background: var(--tooltip-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); min-width: 120px; }
  .tooltip .tt-title { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .tt-key { width: 10px; height: 2px; border-radius: 1px; flex: none; }
  .tooltip .tt-val { font-weight: 600; color: var(--text-primary); }
  .tooltip .tt-name { color: var(--text-secondary); }

  details.data-table { margin-top: 4px; }

  details.data-table summary:hover { color: var(--text-primary); }
  details.data-table table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0 10px; }
  details.data-table th, details.data-table td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid);

  details.data-table th { color: var(--text-muted); font-weight: 500; }

  .timeline li:last-child { border-bottom: none; }
  .timeline .tdate { flex: none; width: 96px; font-size: 12.5px; color: var(--text-muted);

  .timeline .tbody { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }

s EU average", "delta": "World Bank · not a member, shown against the EU average", "value": "165%"}, {"label": "GNI per capita, PPP", "delta": "current international $ · World Bank", "value": "107,770"}, {"label": "Unemployment (ILO)", "delta": "% of labour force · World Bank", "value": "4.6%"}, {"label": "Trade openness", "delta": "exports + imports, % of GDP · World Bank", "value": "79%"}], "heroChart": {"title": "Income relative to the EU average", "sub": "GNI per capita at purchasing-power parity as a share of the EU-wide average. GNI rather than GDP, because GDP overstates income in economies where a lot of output accrues to non-residents. Read the 2021–22 spike carefully. Norwegian income per head at PPP went from $69,890 in 2020 to $128,470 in 2022 and then fell back to $107,770 — a swing of roughly 70 points against the EU average and back again in four years. It sits exactly on the European energy price spike, and Norway is a large net exporter of oil and gas. Nothing about the country's productive capacity changed by 84% in two years.", "series": [{"code": "DERIVED.GNI.PCT.EU", "name": "Norway, % of EU average"}], "opts": {"unit": "%", "dp": 1, "area": true}}, "tabs": {"legal": [{"type": "prose", "title": "Legal", "paras": ["Norway is <strong>not bound by the EU treaties<\/strong>, and is bound by a great deal of EU law anyway. The EEA Agreement, in force since 1 January 1994, extends the single market's rules on goods, services, capital and labour — together with competition, state aid, consumer protection, employment and environmental law — to Norway without giving it a vote on any of them. This is the arrangement usually described from inside the Union as rule-taking.", "Outside the EEA's reach: the common agricultural and fisheries policies, the customs union and common external tariff, the common commercial policy, monetary union, and justice and home affairs beyond what Schengen covers.", "Schengen has applied since <strong>2001<\/strong>, so border checks with the Union are gone even though the border itself is a customs border. Norway is a member of EFTA and disputes under the EEA go to the EFTA Court rather than the Court of Justice of the EU.", "<em>Detailed legal analysis — how much of the acquis actually applies, and how EEA law is incorporated domestically — is pending.<\/em>"]}, {"title": "Rule of law", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Both of these countries sit near the top of this scale throughout, which is the headroom problem the governance estimates run into everywhere in this project.", "series": [{"code": "WGI.RL.EST", "name": "Rule of law"}], "opts": {"unit": "", "dp": 2, "zero": true}, "type": "chart"}], "financial": [{"type": "prose", "title": "Financial", "paras": ["The same World Bank series collected for every member state. Two charts that appear on member pages are absent here and cannot be filled in: EU budget flows, because a non-member neither pays into the budget nor receives from it, and the Eurostat long-term bond series, which is a euro-convergence indicator collected for member states only."]}, {"type": "chartRow", "charts": [{"title": "Real GDP growth, %", "sub": "Annual change in real GDP.", "series": [{"code": "NY.GDP.MKTP.KD.ZG", "name": "Real GDP growth"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "Unemployment, % of labour force", "sub": "ILO-modelled estimate.", "series": [{"code": "SL.UEM.TOTL.ZS", "name": "Unemployment"}], "opts": {"unit": "%", "dp": 1}}]}, {"type": "chartRow", "charts": [{"title": "GNI per capita, PPP vs the EU average", "sub": "Current international $. The EU aggregate is available from 1996.", "series": [{"iso3": "EUU", "code": "NY.GNP.PCAP.PP.CD", "name": "EU average", "colorVar": "--series-2"}, {"code": "NY.GNP.PCAP.PP.CD", "name": "Norway"}], "opts": {"unit": " $", "dp": 0, "endLabelBelow": 2}}, {"title": "Real income per head, % of the EU average", "sub": "Constant 2015 US$, so this one is not moved by exchange rates or inflation — useful as a cross-check on the headline chart.", "series": [{"code": "DERIVED.KD.PCT.EU", "name": "% of EU average"}], "opts": {"unit": "%", "dp": 1}}]}], "commercial": [{"type": "prose", "title": "Commercial", "paras": ["Trade openness is the outcome this project can establish causally for EU members, and it is also the one where the EEA does most of its work: these countries are inside the single market for goods and services without being inside the Union. Read these lines as the counterfactual the trade estimate is measured against."]}, {"title": "Trade in goods &amp; services, % of GDP", "sub": "Exports and imports of goods and services.", "series": [{"code": "NE.EXP.GNFS.ZS", "name": "Exports"}, {"code": "NE.IMP.GNFS.ZS", "name": "Imports", "colorVar": "--series-2"}], "opts": {"unit": "%", "dp": 1, "endLabelBelow": 2}, "type": "chart"}, {"type": "chartRow", "charts": [{"title": "FDI net inflows, % of GDP", "sub": "Foreign direct investment, net inflows.", "series": [{"code": "BX.KLT.DINV.WD.GD.ZS", "name": "FDI net inflows"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "International arrivals, millions", "sub": "World Bank / UNWTO border arrivals. Series generally ends 2019–2020.", "series": [{"code": "ST.INT.ARVL", "name": "Arrivals"}], "opts": {"unit": "m", "dp": 1, "scale": 1e-06}}]}], "political": [{"type": "kpis", "items": [{"label": "First referendum: no", "value": "24-25 Sep 1972", "delta": "53.5% voted against membership of the European Communities and 46.5% in favour. Statistics Norway records turnout at 79."}, {"label": "Second referendum: no", "value": "27-28 Nov 1994", "delta": "52.2% voted against and 47.8% in favour on a turnout of 89.0%. The accession treaty was never ratified; Austria, Finland"}]}, {"type": "prose", "title": "Political", "paras": ["The verified timeline is on the Overview tab. Twice negotiated entry, twice refused it by referendum — 1972 and 1994. In the single market through the EEA since 1994.", "The political question here is the mirror of the one every member page asks. A member page asks what joining did. This one asks what staying out did — and that is a counterfactual about a country that never entered, which no comparison of observed outcomes can supply. See the panel at the top of the Overview tab."]}, {"type": "chartRow", "charts": [{"title": "Voice and accountability", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts.", "series": [{"code": "WGI.VA.EST", "name": "Voice and accountability"}], "opts": {"unit": "", "dp": 2, "zero": true}}, {"title": "Control of corruption", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Higher is better.", "series": [{"code": "WGI.CC.EST", "name": "Control of corruption"}], "opts": {"unit": "", "dp": 2, "zero": true}}]}], "social": [{"type": "prose", "title": "Social", "paras": ["Free movement of people applies here through the EEA and Schengen exactly as it does inside the Union, so the migration series is not measuring a difference in regime."]}, {"title": "Net migration, thousands of people", "sub": "UN World Population Prospects estimates via World Bank. Blue = net inflow, red = net outflow.", "series": [{"code": "SM.POP.NETM", "name": "Net migration"}], "opts": {"type": "bar", "unit": "k", "dp": 1, "zero": true, "scale": 0.001}, "type": "chart"}, {"type": "chartRow", "charts": [{"title": "Income inequality (Gini index)", "sub": "World Bank estimate (0 = perfect equality). Survey-based, so gaps mean no survey rather than no change.", "series": [{"code": "SI.POV.GINI", "name": "Gini index"}], "opts": {"unit": "", "dp": 1}}, {"title": "Net migration per 1,000 residents", "sub": "The same flow scaled by population, which is the comparable form.", "series": [{"code": "DERIVED.NETM.P1000", "name": "Net migration per 1,000"}], "opts": {"unit": "", "dp": 1, "zero": true}}]}]}, "sources": [{"label": "Time series", "text": "World Bank Open Data (api.worldbank.org). Indicator codes travel with every value in <code class=\"ind\">data/indicators.csv<\/code>."}, {"label": "Milestones", "text": "Statistics Norway, the Norwegian Government, the Council of the EU, the European Commission (DG NEAR), EFTA, Iceland's National Electoral Commission and RÚV. The source for each row is recorded in <code class=\"ind\">data/milestones.csv<\/code>, and where two credited sources disagree the row says so rather than picking one."}, {"label": "Relationship metadata", "text": "EEA, Schengen and EFTA status in <code class=\"ind\">data/nonmembers.csv<\/code>."}], "method": [{"title": "Why this page exists", "text": "Norway is one of the non-member countries every estimate in this project is measured against. A control group that is never shown is a control group nobody can check."}, {"title": "What is missing, and why", "text": "EU budget flows and the Eurostat bond series are absent because they do not exist for a non-member — not because collection failed. Everything else on a member page is here."}, {"title": "The EEA changes what the comparison means", "text": "Both non-member profiles in this set are inside the single market through the EEA. So the contrast with a member state is <em>not<\/em> integration against isolation; it is integration without membership against integration with it. That makes them a demanding control, and it is one reason the trade estimate for the Western bloc does not survive its checks."}, {"title": "Attribution caution", "text": "Nothing on this page shows what not joining caused. That would need a counterfactual for a country that never entered, which this design cannot produce."}], "milestones": [{"date": "1962", "sort": 1962.         svg.appendChild(el("path", { d: d, fill: "none" }, "stroke:var(" + s.colorVar + ");stroke-width:2;stroke-linejoin:round;stroke-linecap:round"));
        var li = s.values.length - 1; while (s.values[li] === null) li--;
        svg.appendChild(el("circle", { cx: xs(Y0 + li), cy: ys(s.values[li]), r: 4 }, "fill:var(" + s.colorVar + ");stroke:var(--surface-1);stroke-width:2"));
        var below = opts.endLabelBelow && si === (opts.endLabelBelow - 1);

        /* Two series ending a few hundred euros apart print their end labels on top of one

  /* ---------------- the budget, in and out ---------------- */
  function moneyCard(full) {
    var M = P.money;

      M.perHeadOut === null ? "" : "€" + fmt(M.perHeadOut, 0) + " per person a year"],

      M.perHeadIn === null ? "" : "€" + fmt(M.perHeadIn, 0) + " per person a year"],

      "€" + fmt(Math.abs(M.net), 1) + "bn",

        + "% of national income a year")]
    ].forEach(function (k, i) {
      var t = h("div", "tile");
      t.appendChild(h("div", "label", k[0]));
      var v = h("div", "value"); v.textContent = k[1];

      t.appendChild(v);

      row.appendChild(t);
    });
    card.appendChild(row);

    /* Two bars on one scale: the comparison is the point, and stacking the funds inside
       shows at a glance whether a country's receipts are farm money, cohesion money or

    var COL = ["#2a78d6", "#5faf7e", "#5aa9a2", "#9cbb52", "#d0ae5c", "#d99a68",

    var OCOL = ["#eb6834", "#e08246", "#d59a5e", "#c9a878", "#b0a894"];
    var inP = M.receipts.map(function (r, i) { return { name: r.label, v: r.v, c: COL[i % COL.length] }; });

      .map(function (r, i) { return { name: r.label, v: r.v, c: OCOL[i % OCOL.length] }; });
    var inPos = inP.reduce(function (a, p) { return a + p.v; }, 0);
    var outPos = outP.reduce(function (a, p) { return a + p.v; }, 0);
    var mx = Math.max(inPos, outPos) || 1;
    var Wb = 760, Lb = 74, Rb = 84, pwb = Wb - Lb - Rb, Hb = 118;

      var lab = el("text", { x: Lb - 10, y: r[4] + 21, "text-anchor": "end" }, "fill:var(--text-secondary);font-size:12.5px");
      lab.textContent = r[0]; svgb.appendChild(lab);
      var run = 0;
      r[1].forEach(function (p) {
        var seg = p.v / mx * pwb;
        if (seg <= 0) return;
        var rect = el("rect", { x: Lb + run, y: r[4], width: seg, height: 32 },

        rect.addEventListener("pointerenter", function () {
          while (ttb.firstChild) ttb.removeChild(ttb.firstChild);
          var a = h("div", "tt-title"); a.textContent = p.name; ttb.appendChild(a);

        });
        rect.addEventListener("pointerleave", function () { ttb.style.display = "none"; });

        if (seg > 46) {
          var t = el("text", { x: Lb + run + seg / 2, y: r[4] + 21, "text-anchor": "middle" },

        }

      var tot = el("text", { x: Lb + r[2] / mx * pwb + 7, y: r[4] + 21 },

      var tb = document.createElement("table");
      var hr = document.createElement("tr");
      ["Line", "€bn", "Share"].forEach(function (x) {
        var th = document.createElement("th"); th.textContent = x; hr.appendChild(th);
      });
      tb.appendChild(hr);
      [["Received", M.receipts, M.cumIn], ["Paid in", M.payments, M.cumOut]].forEach(function (grp) {
        var hd = document.createElement("tr");
        var td = document.createElement("td"); td.colSpan = 3;

  /* ---------------- what a non-member pays and gets back ----------------
     There is no budget workbook for a country outside the Union, and the absence is the
     point: nobody publishes an audited net position for a non-member. The rows below are

     not summed. */
  function flowsCard() {
    var F = P.flows;
    if (!F) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "What it pays the Union, and what it gets back"));
    card.appendChild(h("p", "sub", "A non-member has no seat in the EU budget, so there is no "
      + "equivalent of the Commission workbook that every member page draws on. What follows is "
      + "each figure as its own source publishes it."));

    function tbl(rows, heading) {
      if (!rows.length) return;
      card.appendChild(h("h4", null, heading));
      var t = h("table", "t");
      var hr = document.createElement("tr");
      ["Item", "Amount", "Basis", "Period"].forEach(function (x, j) {
        var th = document.createElement("th"); if (j === 1) th.className = "num";
        th.textContent = x; hr.appendChild(th);
      });
      t.appendChild(hr);
      rows.forEach(function (r) {
        var tr = document.createElement("tr");
        var unit = r.currency.split(" ");          // "EUR m" -> ["EUR","m"]
        var amt = (unit[0] === "%")
          ? r.amount + "%"
          : unit[0] + " " + Number(r.amount).toLocaleString("en-US") + (unit[1] || "");
        [[r.label, "nm"], [amt, "num"], [r.basis, ""], [r.period, ""]]
          .forEach(function (c) {
            var td = document.createElement("td"); td.className = c[1];
            td.textContent = c[0]; tr.appendChild(td);
          });
        t.appendChild(tr);
        var d = document.createElement("tr");
        var dt = document.createElement("td"); dt.colSpan = 4; dt.className = "warnrow";
        dt.textContent = r.detail + " — " + r.source;
        d.appendChild(dt); t.appendChild(d);
      });
      card.appendChild(t);
    }
    tbl(F.out, "Paid");
    tbl(F["in"], "Received");

    card.appendChild(h("p", "note", "<strong>These are not added up, and that is deliberate.</strong> "
      + "They sit on different bases — some are annual averages, some are totals for a whole "
      + "funding period, and two currencies are involved. No institution publishes a single "
      + "audited net position for a non-member the way the Commission does for a member state, "
      + "and constructing one here by summing across bases would produce a number that looks "
      + "authoritative and is not. The comparison a reader wants — what this country pays "
      + "against what a member of the same size pays — cannot be made from published figures "
      + "at the standard this project holds itself to."));

        + "bend in a line can be read against what happened that year. It starts in "
        + P.window.start + ", the first year any chart on this page has data for; anything "
        + "earlier is listed at the foot of the list rather than plotted against nothing."));
      var lgm = h("div", "legend");
      var lgk = [["--series-1", "This country"], ["--text-muted", "EU-wide"]];
      if ((P.disputes || []).length) lgk.push(["--neg", "Point of contention"]);
      lgk.forEach(function (k) {
        var key = h("span", "key");
        var sw = h("span", "swatch-line");
        sw.style.background = "var(" + k[0] + ")";
        sw.style.height = "9px"; sw.style.width = "9px"; sw.style.borderRadius = "50%";
        key.appendChild(sw); key.appendChild(document.createTextNode(k[1]));
        lgm.appendChild(key);
      });
      mc.appendChild(lgm);
      var ul = h("ul", "timeline");
      P.milestones.filter(function (m) { return m.scope !== "dispute"; }).forEach(function (m) {
        var li = document.createElement("li");
        li.className = (m.kind === "era" ? "era " : "") + "scope-" + m.scope;
        li.appendChild(h("span", "tdate", m.date));
        li.appendChild(h("span", "tl-dot" + (m.kind === "warn" ? " warn" : "")
          + (m.scope === "eu" ? " eu" : "")));
        li.appendChild(h("span", "tbody", "<strong>" + m.label + "</strong> — " + m.description
          + (m.scope === "eu" ? " <span class=\"tag\">EU-wide</span>" : "")));
        ul.appendChild(li);
      });
      mc.appendChild(ul);
      if ((P.milestonesDropped || []).length) {
        mc.appendChild(h("p", "note", (P.milestonesDropped.length === 1 ? "One earlier event falls"
          : P.milestonesDropped.length + " earlier events fall")
          + " outside the range this page has data for and are not listed: "
          + P.milestonesDropped.map(function (d) { return d.label + " (" + d.date + ")"; }).join("; ")
          + "."));
      }
      sec.appendChild(mc);
    } else if (t.id === "financial") {
      var fm = moneyCard(true); if (fm) sec.appendChild(fm);
      buildBlocks(sec, P.tabs[t.id] || []);
    } else if (t.id === "sources") {
      var sc = h("div", "card prose");
      sc.appendChild(h("h3", null, "Sources"));
      var sl = h("div", "src-list");
      P.sources.forEach(function (s) { sl.appendChild(h("p", null, "<strong>" + s.label + "</strong> — " + s.text)); });
      sc.appendChild(sl);
      sec.appendChild(sc);
      var mcd = h("div", "card prose");
      mcd.appendChild(h("h3", null, "Method &amp; confidence notes"));
      P.method.forEach(function (m) { mcd.appendChild(h("p", null, "<strong>" + m.title + ".</strong> " + m.text)); });
      sec.appendChild(mcd);
    } else {
      buildBlocks(sec, P.tabs[t.id] || []);
    }
  });

  tabsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    tabsEl.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
    panelsEl.querySelectorAll("section.panel").forEach(function (p) { p.classList.remove("active"); });
    document.getElementById("panel-" + b.dataset.tab).classList.add("active");
  });

  var modes = ["auto", "light", "dark"], mi = 0, btn = document.getElementById("themeBtn");
  btn.addEventListener("click", function () {
    mi = (mi + 1) % 3;
    var m = modes[mi];
    if (m === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", m);
    btn.textContent = "Theme: " + m;
  });
})();
</script>
</body>
</html>
