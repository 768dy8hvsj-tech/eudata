  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .wrap { max-width: 1060px; margin: 0 auto; }

  .theme-btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);

  .theme-btn:hover { color: var(--text-primary); }

  nav.tabs { display: flex; gap: 4px; margin: 20px 0 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary);

  nav.tabs button:hover { color: var(--text-primary); }

  section.panel { display: none; }

  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }

  .tile .delta { font-size: 12.5px; margin-top: 6px; color: var(--text-secondary); }
  .tile .delta strong { color: var(--text-primary); font-weight: 600; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;

  .legend { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }

  .chart-box { position: relative; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .tooltip { position: absolute; pointer-events: none; display: none; z-index: 5; background: var(--tooltip-bg);

": "GDP per capita (PPP), vs EU average", "delta": "up from <strong>45%<\/strong> in 1996 · World Bank", "value": "83%"}, {"label": "Net EU budget transfers, 2004–2023", "value": "€161.8bn", "delta": "€245.5bn received − €83.7bn paid in · Ministry of Finance (PL)"}, {"label": "Unemployment (ILO), 2025", "delta": "peak <strong>20.2%<\/strong> in 2002, on the eve of entry · World Bank", "value": "3.0%"}, {"label": "Exports of goods &amp; services, % of GDP", "delta": "<strong>22%<\/strong> in 1996 · World Bank", "value": "50%"}], "heroChart": {"title": "Convergence with the EU: GDP per capita (PPP) as % of EU average", "sub": "Poland's income level relative to the EU-wide average, current international $ at purchasing power parity. Shaded band = accession negotiations (Mar 1998 – Dec 2002) and ratification; vertical line = EU entry.", "series": [{"code": "DERIVED.PPP.PCT.EU", "name": "Poland, % of EU average"}], "opts": {"unit": "%", "dp": 1, "area": true}}, "tabs": {"legal": [{"type": "prose", "title": "Adopting the acquis (1994–2004)", "paras": ["Membership required Poland to absorb the entire body of EU law — the <strong>acquis communautaire<\/strong>, negotiated across ~30 chapters between 1998 and 2002. This drove a wholesale harmonisation of Polish legislation before entry: competition and state-aid rules, environmental standards, food safety, public procurement, consumer protection, border and customs law. Pre-accession restructuring of coal and steel had to conform to EU state-aid discipline before day one.", "The 1997 Constitution was written with membership in view: <strong>Articles 90–91<\/strong> permit the transfer of competences to an international organisation and give ratified treaties precedence over national statutes — the domestic legal basis for EU law's direct effect in Poland."]}, {"type": "prose", "title": "Inside the Union: supremacy and its limits (2004–2015)", "paras": ["From 1 May 2004 EU regulations applied directly and Polish courts began referring questions to the Court of Justice of the EU. Poland's Constitutional Tribunal accepted membership but — like Germany's — reserved the Constitution's position as supreme domestic law, a tension that stayed theoretical for a decade."]}, {"type": "prose", "title": "The rule-of-law conflict (2015–2023)", "paras": ["Judicial overhauls from late 2015 (Constitutional Tribunal appointments, court restructuring, a Disciplinary Chamber for judges) triggered the Commission's rule-of-law framework in <strong>January 2016<\/strong> and, on <strong>20 December 2017<\/strong>, the first-ever activation of <strong>Article 7(1) TEU<\/strong> against a member state. The CJEU ruled repeatedly against the disciplinary regime; in <strong>October 2021<\/strong> Poland's Constitutional Tribunal ruled parts of the EU treaties unconstitutional — a direct challenge to the primacy of EU law — and the CJEU imposed a €1m-per-day penalty (later halved) for keeping the Disciplinary Chamber running. Recovery-fund and cohesion money was withheld."]}, {"type": "prose", "title": "Resolution (2022–2024)", "paras": ["A June 2022 law abolished the Disciplinary Chamber; after the 2023 change of government, Poland met the Commission's \"super milestones\" on judicial independence. On <strong>29 February 2024<\/strong> the Commission unblocked up to <strong>€137bn<\/strong> (€59.8bn recovery funds + €76.5bn cohesion), and on <strong>29 May 2024<\/strong> the Article 7 procedure was closed."], "note": "Net effect over the window: Polish law was first massively harmonised toward EU norms (1994–2004), then became the EU's main testing ground for what happens when a member state contests EU law's primacy — ending with EU financial leverage proving decisive."}, {"type": "chart", "title": "Rule of law", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Poland's estimate rose to 0.84 by 2015 and stood at 0.36 in 2023, the period of the judiciary reforms and the Article 7 proceeding.", "series": [{"code": "WGI.RL.EST", "name": "Rule of law"}], "opts": {"unit": "", "dp": 2, "zero": true}}], "financial": [{"type": "prose", "title": "The headline", "paras": ["Poland went from <strong>45% of average EU income in 1996 to ~83% in 2025<\/strong> (PPP), was the only EU economy to avoid recession in 2009, and received net EU transfers averaging roughly <strong>2–3.5% of GDP per year<\/strong> after entry (€161.8bn net, 2004–2023). Unemployment peaked at 20.2% in 2002 just before entry and sits near 3% today — among the EU's lowest."]}, {"type": "chartRow", "charts": [{"title": "Real GDP growth, %", "sub": "Annual change. Note 2009: +2.6% while the rest of the EU contracted.", "series": [{"code": "NY.GDP.MKTP.KD.ZG", "name": "Real GDP growth"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "Inflation (CPI), %", "sub": "Disinflation through the 1990s accession run-up; 2022–23 energy-shock spike.", "series": [{"code": "FP.CPI.TOTL.ZG", "name": "CPI inflation"}], "opts": {"unit": "%", "dp": 1, "zero": true}}]}, {"type": "chartRow", "charts": [{"title": "Unemployment, % of labour force", "sub": "ILO-modelled estimate. The 2002 peak preceded entry; the post-2004 fall reflects growth plus emigration.", "series": [{"code": "SL.UEM.TOTL.ZS", "name": "Unemployment"}], "opts": {"unit": "%", "dp": 1}}, {"title": "GDP per capita, PPP (current intl $)", "sub": "Poland vs the EU average. The gap closes steadily after 2004.", "series": [{"iso3": "EUU", "code": "NY.GDP.PCAP.PP.CD", "name": "EU average", "colorVar": "--series-2"}, {"code": "NY.GDP.PCAP.PP.CD", "name": "Poland"}], "opts": {"unit": " $", "dp": 0, "endLabelBelow": 2}}]}, {"type": "chartRow", "charts": [{"title": "Long-term government bond yield, %", "sub": "Eurostat EMU convergence-criterion series: yield on ten-year government bonds. Poland's fell from 10.68% in 2001 to a low of 1.50% in 2020, then rose to 5.52% by 2025.", "series": [{"code": "EUROSTAT.IRT_LT_MCBY", "name": "10-year yield"}], "opts": {"unit": "%", "dp": 2}}, {"title": "Net annual earnings, €", "sub": "Single person, no children, on 100% of the average wage. Eurostat flags 2024 as a break in series, so 2000–2023 and 2024–2025 are two segments rather than one line.", "series": [{"code": "EUROSTAT.EARN_NT_NET", "name": "Net annual earnings"}], "opts": {"unit": " €", "dp": 0}}]}], "commercial": [{"type": "prose", "title": "Single-market integration", "paras": ["Trade openness transformed: exports rose from <strong>22% of GDP (1996) to a peak of 62% (2022)<\/strong>. The large majority of Poland's goods exports go to other EU states, with Germany by far the largest single partner <span class=\"flag\">(≈ share varies by year — see method note)<\/span>. Inside the single market Poland became one of Europe's leading production bases for automotive components, home appliances and furniture, and after 2004 a major nearshoring destination for services.", "EU competition and state-aid rules have applied in full since 2004, ending the discretionary industrial subsidies of the transition era; accession itself was conditional on restructuring coal and steel under state-aid discipline."]}, {"type": "chart", "title": "Who it trades with: the EU's share", "sub": "Share of Poland's total exports and imports going to or coming from the other EU member states. This measures direction rather than volume — and it barely moves. Poland was already sending three-quarters of its exports to the EU two years before it joined.", "series": [{"code": "TRADE.EU.EXP.SHR", "name": "Exports to the EU"}, {"code": "TRADE.EU.IMP.SHR", "name": "Imports from the EU", "colorVar": "--series-2"}], "opts": {"unit": "%", "dp": 1, "endLabelBelow": 2}}, {"type": "chart", "title": "Trade in goods &amp; services, % of GDP", "sub": "Exports and imports of goods and services. Poland ran persistent deficits before accession; exports overtook imports for most years after 2013.", "series": [{"code": "NE.EXP.GNFS.ZS", "name": "Exports"}, {"code": "NE.IMP.GNFS.ZS", "name": "Imports", "colorVar": "--series-2"}], "opts": {"unit": "%", "dp": 1, "endLabelBelow": 2}}, {"type": "chartRow", "charts": [{"title": "FDI net inflows, % of GDP", "sub": "Foreign direct investment. Pre-accession privatisation wave (1998–2000), then post-entry surges 2004–07 and 2021–22.", "series": [{"code": "BX.KLT.DINV.WD.GD.ZS", "name": "FDI net inflows"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "International arrivals, millions", "sub": "World Bank / UNWTO border arrivals incl. same-day visitors. Counting methodology changed around 2000–01; series ends 2019.", "series": [{"code": "ST.INT.ARVL", "name": "Arrivals"}], "opts": {"unit": "m", "dp": 1, "scale": 1e-06}}]}], "political": [{"type": "kpis", "items": [{"label": "2003 accession referendum — yes vote", "value": "77.45%", "delta": "turnout <strong>58.85%<\/strong> · 7–8 June 2003"}, {"label": "Public support for membership", "value": "~80–90%", "delta": "range across two decades of CBOS polling — consistently among the EU's highest <span class=\"flag\">(≈)<\/span>"}, {"label": "Article 7 procedure", "value": "2017–2024", "delta": "first ever triggered; closed <strong>29 May 2024<\/strong>"}]}, {"type": "prose", "title": "How membership reshaped the political landscape", "paras": ["<strong>1991–2004:<\/strong> EU entry was the consensus goal of every government, left and right — the SLD-PSL and AWS-UW governments negotiated and closed the deal; the referendum passed 3-to-1.", "<strong>2004–2015:<\/strong> Politics reorganised around the pace and terms of integration rather than membership itself. Civic Platform (PO) under Donald Tusk (PM 2007–2014) positioned Poland as a core EU player; Tusk became <strong>President of the European Council (2014–2019)<\/strong>. Law and Justice (PiS) built a sovereigntist counter-pole while never advocating exit.", "<strong>2015–2023:<\/strong> The PiS governments' judicial overhaul turned relations with Brussels into the central axis of Polish politics — Article 7, CJEU fines and frozen funds became domestic campaign issues. Membership support stayed high throughout; the dispute was about EU authority, not EU membership.", "<strong>2023–today:<\/strong> The October 2023 election returned a pro-EU coalition under Tusk; funds were unblocked within months and Poland held the Council presidency in the first half of 2025. The presidency remains a counterweight: Karol Nawrocki, backed by PiS, won the June 2025 presidential election."], "note": "Structural change: EU accession created a durable pro-integration vs sovereigntist cleavage that has organised Polish party competition since 2004 — while support for membership itself has never been seriously contested."}, {"type": "chartRow", "charts": [{"title": "Voice and accountability", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Participation in selecting government, plus freedom of expression, association and the press.", "series": [{"code": "WGI.VA.EST", "name": "Voice and accountability"}], "opts": {"unit": "", "dp": 2, "zero": true}}, {"title": "Control of corruption", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Higher is better — a rising line means stronger control of corruption, not more of it.", "series": [{"code": "WGI.CC.EST", "name": "Control of corruption"}], "opts": {"unit": "", "dp": 2, "zero": true}}]}], "social": [{"type": "prose", "title": "Migration: out, then in", "paras": ["<strong>The post-2004 exodus:<\/strong> free movement opened the UK, Irish and Swedish labour markets on day one. GUS estimates put Poles living temporarily abroad at over <strong>2 million<\/strong> at the peak — one of the largest intra-EU migrations ever — easing unemployment at home and generating substantial remittances.", "<strong>The reversal:<\/strong> from the mid-2010s Poland itself became a major immigration destination, first for Ukrainian workers, then — after Russia's February 2022 invasion — as the EU's principal first-arrival refugee host, with around <strong>1 million Ukrainians under temporary protection<\/strong>. The 2022 spike dominates the chart below."]}, {"type": "chart", "title": "Net migration, thousands of people", "sub": "UN World Population Prospects estimates via World Bank. Blue = net inflow, red = net outflow. Post-2022 values are heavily model-revised (refugee movements and returns) — treat recent years as indicative.", "series": [{"code": "SM.POP.NETM", "name": "Net migration"}], "opts": {"type": "bar", "unit": "k", "dp": 1, "zero": true, "peakLabel": "2022, Ukrainian refugees", "scale": 0.001}}, {"type": "chartRow", "charts": [{"title": "Income inequality (Gini index)", "sub": "World Bank estimate (0 = perfect equality). Inequality rose through transition, peaked around accession, then fell to below the EU norm.", "series": [{"code": "SI.POV.GINI", "name": "Gini index"}], "opts": {"unit": "", "dp": 1}}, {"title": "Net migration per 1,000 residents", "sub": "The same flow scaled by population, which is the comparable form — the chart above is a headcount and so partly tracks country size.", "series": [{"code": "DERIVED.NETM.P1000", "name": "Net migration per 1,000"}], "opts": {"unit": "", "dp": 1, "zero": true}}], "prose": {"title": "Welfare &amp; living standards", "paras": ["The Gini decline from ~38 (2004) to ~28.5 (2023) reflects tight labour markets, EU-supported rural incomes (CAP direct payments), minimum-wage growth and the <strong>\"500+\" child benefit<\/strong> (2016; raised to 800 PLN in 2024), which sharply cut child poverty.", "EU cohesion money — €161bn of the €245.5bn received through 2023 — rebuilt infrastructure: the motorway/expressway network expanded several-fold after 2004, and EU co-financing touched rail, water, broadband and universities in every region."]}}]}, "sources": [{"label": "Time series", "text": "World Bank Open Data (api.worldbank.org), retrieved 27 Jul 2026. Indicator codes are carried in <code class=\"ind\">data/indicators.csv<\/code> alongside every value."}, {"label": "EU budget flows", "text": "Polish Ministry of Finance figures compiled by Prof. E. Kawecka-Wyrzykowska, <a href=\"https://gazeta.sgh.waw.pl/en/people-events/financial-flows-between-poland-and-eu-2004-2023-and-prospects-their-changes\">SGH Warsaw School of Economics<\/a> (€245.5bn received, €83.7bn contributed, €161.8bn net, 2004–2023)."}, {"label": "Funds unblocking", "text": "<a href=\"https://ec.europa.eu/regional_policy/whats-new/newsroom/29-02-2024-poland-s-efforts-to-restore-rule-of-law-pave-the-way-for-accessing-up-to-eur137-billion-in-eu-funds_en\">European Commission, 29 Feb 2024<\/a> (up to €137bn: €59.8bn RRF + €76.5bn cohesion)."}, {"label": "Article 7 closure", "text": "<a href=\"https://www.consilium.europa.eu/en/policies/article-7-procedures/timeline-the-story-of-article-7/\">Council of the EU Article 7 timeline<\/a>; <a href=\"https://www.euronews.com/my-europe/2024/05/29/poland-exits-article-7-the-eus-special-procedure-on-rule-of-law\">Euronews, 29 May 2024<\/a>."}, {"label": "Accession timeline", "text": "<a href=\"https://eur-lex.europa.eu/EN/legal-content/summary/the-2004-enlargement-the-challenge-of-a-25-member-eu.html\">EUR-Lex: The 2004 enlargement<\/a>; dates and referendum figures cross-checked against <a href=\"https://en.wikipedia.org/wiki/Poland_and_the_European_Union\">Wikipedia: Poland and the European Union<\/a>."}, {"label": "2025 presidential election", "text": "Karol Nawrocki won the 1 June 2025 run-off — <a href=\"https://en.wikipedia.org/wiki/2025_Polish_presidential_election\">2025 Polish presidential election<\/a>, reported by <a href=\"https://www.npr.org/2025/06/02/nx-s1-5   /* ---------------- the budget, in and out ---------------- */

    var COL = ["#2a78d6", "#5faf7e", "#5aa9a2", "#9cbb52", "#d0ae5c", "#d99a68",

    var hd = h("div", "arow ahead");
    hd.appendChild(h("span", "aarea", ""));
    hd.appendChild(h("span", "acell", "EU member"));
    hd.appendChild(h("span", "acell", P.name));
    grid.appendChild(hd);
    var seen = {};
    A.rows.forEach(function (r) {
      if (!seen[r.group]) {
        seen[r.group] = 1;
        grid.appendChild(h("div", "agroup", r.group));
      }
      var row = h("div", "arow");
      var nm = h("span", "aarea", r.area);
      row.appendChild(nm);
      [r.eu, r.here].forEach(function (v) {
        var c = h("span", "acell");
        var box = h("span", "abox " + v);
        box.title = v === "full" ? "applies in full"
          : v === "partial" ? "applies in part" : "does not apply";
        c.appendChild(box);
        row.appendChild(c);
      });
      grid.appendChild(row);
      if (r.note) grid.appendChild(h("div", "anote", r.note));
    });
    card.appendChild(grid);
    card.appendChild(h("p", "note", "Built from the structure of the agreements themselves — "
      + "the EEA Agreement's annexes and the Swiss bilateral packages — rather than from a "
      + "percentage. The often-quoted figures for “how much EU law Norway has adopted” vary "
      + "wildly because they depend on what is being counted; EFTA's own tracker records more "
      + "than 9,500 acts as having been part of the EEA Agreement at some point, with around "
      + "5,000 in force. A map is more honest than a number. Sources: European Parliament "
      + "research service briefing on EU–Norway relations (2025), the EEA Agreement, EFTA and "
      + "the Swiss Federal Department of Foreign Affairs."));
    return card;
  }

  /* ---------------- what joining would actually change ---------------- */
  function joiningCard() {
    var J = P.joining;
    if (!J) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "Where membership would change something, and where it would cost"));
    card.appendChild(h("p", "sub", "Derived from the coverage map above: an area that already "
      + "applies in full would not change on joining, and one that applies partly or not at all "
      + "would. What follows is what would change — not whether it would be worth it."));
    var g = h("div", "grid2");
    [["What it would gain", J.gains, "good"], ["What it would give up", J.costs, "warn"]]
      .forEach(function (side) {
        var col = h("div", "jcol " + side[2]);
        col.appendChild(h("h4", null, side[0]));
        side[1].forEach(function (x) {
          col.appendChild(h("div", "jhead", x.head));
          col.appendChild(h("div", "jbody", x.body));
        });
        g.appendChild(col);
      });
    card.appendChild(g);
    card.appendChild(h("p", "note", J.verdictNote));
    return card;
  }

  /* ---------------- where this country's exports actually go ----------------
     One bar, nine segments, summing to 100. The point of a partition rather than a ranked
     list is that it answers "and the rest?" in the same glance. */
  function destinationsCard() {
    var D = P.destinations;
    if (!D) return null;
    var COL = { EU: "#2a78d6", EUR: "#5aa9a2", ASIA: "#5faf7e", NAMER: "#d0ae5c",
                MEAST: "#d99a68", LATAM: "#cf8a86", AFR: "#b58aa8", OCE: "#948fbd",
                OTHER: "#c3c2b7" };
    var card = h("div", "card");
    card.appendChild(h("h3", null, "Where its exports actually go"));
    card.appendChild(h("p", "sub", "Goods exports by destination region, " + D.year
      + ", as a share of the total. Built by summing every individual trading partner in the "
      + "Commission's COMEXT bilateral data, so the nine shares add to 100 rather than "
      + "overlapping. Hover any segment."));

    var rows = D.rows.slice().sort(function (a, b) { return b.value - a.value; });
    var root = h("div", "chart-box");
    var W = 760, L = 0, R = 0, Hb = 62;
    var svg = el("svg", { viewBox: "0 0 " + W + " " + Hb, role: "img",
      "aria-label": "exports by destination" });
    var tt = h("div", "tooltip");
    var run = 0, total = rows.reduce(function (a, r) { return a + r.value; }, 0) || 100;
    rows.forEach(function (r) {
      var seg = r.value / total * W;
      if (seg <= 0) return;
      var rect = el("rect", { x: run, y: 0, width: seg, height: 38 },
        "fill:" + COL[r.code] + ";stroke:var(--surface-1);stroke-width:1");
      rect.addEventListener("pointerenter", function () {
        while (tt.firstChild) tt.removeChild(tt.firstChild);
        var a = h("div", "tt-title"); a.textContent = r.label; tt.appendChild(a);
        var b = h("div", "tt-val"); b.textContent = fmt(r.value, 1).replace("+", "") + "% of exports";
        tt.appendChild(b);
        tt.style.display = "block"; tt.style.left = "10px"; tt.style.top = "44px";
      });
      rect.addEventListener("pointerleave", function () { tt.style.display = "none"; });
      svg.appendChild(rect);
      if (seg > 52) {
        var t1 = el("text", { x: run + seg / 2, y: 23, "text-anchor": "middle" },
          "fill:#fff;font-size:12px;font-weight:600;pointer-events:none;font-variant-numeric:tabular-nums");
        t1.textContent = r.value.toFixed(r.value >= 10 ? 0 : 1) + "%";
        svg.appendChild(t1);
      }
      if (seg > 76) {
        var t2 = el("text", { x: run + seg / 2, y: 52, "text-anchor": "middle" },
          "fill:var(--text-secondary);font-size:11px;pointer-events:none");
        t2.textContent = r.label;
        svg.appendChild(t2);
      }
      run += seg;
    });
    root.appendChild(svg); root.appendChild(tt);
    card.appendChild(root);

    var tb = h("table", "t");
    var hr = document.createElement("tr");
    ["Destination", "% of exports"].forEach(function (x, j) {
      var th = document.createElement("th"); if (j) th.className = "num";
      th.textContent = x; hr.appendChild(th);
    });
    tb.appendChild(hr);
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      var td = document.createElement("td"); td.className = "nm";
      td.innerHTML = '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;'
        + 'margin-right:7px;background:' + COL[r.code] + '"></span>' + r.label;
      tr.appendChild(td);
      var td2 = document.createElement("td"); td2.className = "num";
      td2.textContent = r.value.toFixed(1) + "%"; tr.appendChild(td2);
      tb.appendChild(tr);
    });
    card.appendChild(tb);
    card.appendChild(h("p", "note", "Goods only — services are not in this dataset, which "
      + "matters for economies that sell more services than goods. “Unallocated” is ships' and "
      + "aircraft stores and partners not specified; it is kept visible rather than "
      + "redistributed, and it is material for the bunkering economies. Regions are UN M49 "
      + "style: Mexico sits in Latin America, not North America. Source: European Commission "
      + "COMEXT, dataset ds-059331."));
    return card;
  }

  function buildBlocks(host, blocks) {
    blocks.forEach(function (b) {
      if (b.type === "prose") host.appendChild(proseCard(b));
      else if (b.type === "kpis") host.appendChild(kpiRow(b.items));
      else if (b.type === "chart") host.appendChild(chartCard(b));
      else if (b.type === "chartRow") {
        var g = h("div", "grid2");
        b.charts.forEach(function (c) { g.appendChild(chartCard(c)); });
        if (b.prose) g.appendChild(proseCard(b.prose));
        host.appendChild(g);
      }
    });
  }

  // ---------------- panels ----------------
  var TABS = [
    { id: "overview", label: "Overview" },
    { id: "legal", label: "Legal" },
    { id: "financial", label: "Financial" },
    { id: "commercial", label: "Commercial" },
    { id: "political", label: "Political" },
    { id: "social", label: "Social" },
    { id: "sources", label: "Sources & method" }
  ];
  var tabsEl = document.getElementById("tabs"), panelsEl = document.getElementById("panels");

  TABS.forEach(function (t, i) {
    var b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.dataset.tab = t.id;
    b.textContent = t.label;
    tabsEl.appendChild(b);

    var sec = h("section", "panel" + (i === 0 ? " active" : ""));
    sec.id = "panel-" + t.id;
    panelsEl.appendChild(sec);

    if (t.id === "overview") {
      sec.appendChild(kpiRow(P.kpis));
      var vc = verdictCard(); if (vc) sec.appendChild(vc);
      sec.appendChild(chartCard(P.heroChart));
      var mnc = moneyCard(false); if (mnc) sec.appendChild(mnc);
      var fc = flowsCard(); if (fc) sec.appendChild(fc);
      var dc = disputesCard(); if (dc) sec.appendChild(dc);
      var ac = acquisCard(); if (ac) sec.appendChild(ac);
      var jc = joiningCard(); if (jc) sec.appendChild(jc);
      if ((P.context || []).length) {
        var cc = h("div", "card prose");
        cc.appendChild(h("h3", null, "Where this country sits in the wider findings"));
        cc.appendChild(h("p", "sub", "Drawn from the cross-country analysis rather than "
          + "written for this page. <a href=\"analysis.html\">The full argument →</a>"));
        P.context.forEach(function (c) {
          cc.appendChild(h("p", null, "<strong>" + c.title + ".</strong> " + c.text));
        });
        sec.appendChild(cc);
      }
      var mc = h("div", "card");
      mc.appendChild(h("h3", null, "Milestones at a glance"));
      mc.appendChild(h("p", "sub", "This country's own events, and the Union-wide ones it "
        + "lived through. The same events are marked on the rail under every chart, so a "
        + "bend in a line can be read against what happened that year. It starts in "
        + P.window.start + ", the first year any chart on this page has data for; anything "
        + "earlier is listed at the foot of the list rather than plotted against nothing."));
      var lgm = h("div", "legend");
      var lgk = [["--series-1", "This country"], ["--text-muted", "EU-wide"]];
      if ((P.disputes || []).length) lgk.push(["--neg", "Point of contention"]);
      lgk.forEach(function (k) {
        var key = h("span", "key");
        var sw = h("span", "swatch-line");
        sw.style.background = "var(" + k[0] + ")";
        sw.style.height = "9px"; sw.style.width = "9px"; sw.style.borderRadius = "50%";
        key.appendChild(sw); key.appendChild(document.createTextNode(k[1]));
        lgm.appendChild(key);
      });
      mc.appendChild(lgm);
      var ul = h("ul", "timeline");
      P.milestones.filter(function (m) { return m.scope !== "dispute"; }).forEach(function (m) {
        var li = document.createElement("li");
        li.className = (m.kind === "era" ? "era " : "") + "scope-" + m.scope;
        li.appendChild(h("span", "tdate", m.date));
        li.appendChild(h("span", "tl-dot" + (m.kind === "warn" ? " warn" : "")
          + (m.scope === "eu" ? " eu" : "")));
        li.appendChild(h("span", "tbody", "<strong>" + m.label + "</strong> — " + m.description
          + (m.scope === "eu" ? " <span class=\"tag\">EU-wide</span>" : "")));
        ul.appendChild(li);
      });
      mc.appendChild(ul);
      if ((P.milestonesDropped || []).length) {
        mc.appendChild(h("p", "note", (P.milestonesDropped.length === 1 ? "One earlier event falls"
          : P.milestonesDropped.length + " earlier events fall")
          + " outside the range this page has data for and are not listed: "
          + P.milestonesDropped.map(function (d) { return d.label + " (" + d.date + ")"; }).join("; ")
          + "."));
      }
      sec.appendChild(mc);
    } else if (t.id === "commercial") {
      var dcx = destinationsCard(); if (dcx) sec.appendChild(dcx);
      buildBlocks(sec, P.tabs[t.id] || []);
    } else if (t.id === "financial") {
      var fm = moneyCard(true); if (fm) sec.appendChild(fm);
      buildBlocks(sec, P.tabs[t.id] || []);
    } else if (t.id === "sources") {
      var sc = h("div", "card prose");
      sc.appendChild(h("h3", null, "Sources"));
      var sl = h("div", "src-list");
      P.sources.forEach(function (s) { sl.appendChild(h("p", null, "<strong>" + s.label + "</strong> — " + s.text)); });
      sc.appendChild(sl);
      sec.appendChild(sc);
      var mcd = h("div", "card prose");
      mcd.appendChild(h("h3", null, "Method &amp; confidence notes"));
      P.method.forEach(function (m) { mcd.appendChild(h("p", null, "<strong>" + m.title + ".</strong> " + m.text)); });
      sec.appendChild(mcd);
    } else {
      buildBlocks(sec, P.tabs[t.id] || []);
    }
  });

  tabsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    tabsEl.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
    panelsEl.querySelectorAll("section.panel").forEach(function (p) { p.classList.remove("active"); });
    document.getElementById("panel-" + b.dataset.tab).classList.add("active");
  });

  var modes = ["auto", "light", "dark"], mi = 0, btn = document.getElementById("themeBtn");
  btn.addEventListener("click", function () {
    mi = (mi + 1) % 3;
    var m = modes[mi];
    if (m === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", m);
    btn.textContent = "Theme: " + m;
  });
})();
</script>
</body>
</html>
