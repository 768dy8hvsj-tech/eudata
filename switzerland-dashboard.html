<title>Switzerland — outside the Union</title>
<style>

      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);

    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --neg: #e66767;
    --band: rgba(57,135,229,0.10); --tooltip-bg: #242423;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; padding: 24px 20px 48px; }
  .wrap { max-width: 1060px; margin: 0 auto; }

  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; max-width: 660px; line-height: 1.5; }
  .theme-btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .theme-btn:hover { color: var(--text-primary); }

  nav.tabs { display: flex; gap: 4px; margin: 20px 0 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary);
    font-size: 14px; font-weight: 500; padding: 8px 14px 10px; cursor: pointer; font-family: inherit; }
  nav.tabs button:hover { color: var(--text-primary); }
  nav.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); font-weight: 600; }

  section.panel { display: none; }
  section.panel.active { display: block; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .tile .label { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .tile .delta { font-size: 12.5px; margin-top: 6px; color: var(--text-secondary); }
  .tile .delta strong { color: var(--text-primary); font-weight: 600; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 780px) { .grid2 { grid-template-columns: 1fr; } }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 18px 12px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; font-weight: 600; }
  .card .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; margin-bottom: 10px; line-height: 1.45; }
  .card.prose { padding-bottom: 18px; }
  .card.prose p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px; }
  .card.prose p strong { color: var(--text-primary); font-weight: 600; }

  .legend { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .legend .key { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .key .swatch-line { width: 16px; height: 2px; border-radius: 1px; }

  .chart-box { position: relative; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .tooltip { position: absolute; pointer-events: none; display: none; z-index: 5; background: var(--tooltip-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); min-width: 120px; }
  .tooltip .tt-title { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .tt-key { width: 10px; height: 2px; border-radius: 1px; flex: none; }
  .tooltip .tt-val { font-weight: 600; color: var(--text-primary); }
  .tooltip .tt-name { color: var(--text-secondary); }

  details.data-table { margin-top: 4px; }
  details.data-table summary { font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 6px 0; }
  details.data-table summary:hover { color: var(--text-primary); }
  details.data-table table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0 10px; }
  details.data-table th, details.data-table td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid);
    font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  details.data-table th { color: var(--text-muted); font-weight: 500; }
  details.data-table th:first-child, details.data-table td:first-child { text-align: left; }

  .timeline { list-style: none; margin-top: 6px; }
  .timeline li { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
  .timeline li:last-child { border-bottom: none; }
  .timeline .tdate { flex: none; width: 96px; font-size: 12.5px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; padding-top: 1px; }
  .timeline .tbody { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }
  .timeline .tbody strong { color: var(--text-primary); font-weight: 600; }
  .timeline li.era .tbody strong { color: var(--series-1); }
  .timeline li.scope-eu .tbody { color: var(--text-muted); }
  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  table.t th, table.t td { padding: 5px 8px; border-bottom: 1px solid var(--grid);
    color: var(--text-secondary); text-align: left; }
  table.t th { color: var(--text-muted); font-weight: 500; }
  table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.t td.nm { color: var(--text-primary); font-weight: 500; }
  .acquis { margin-top: 8px; }
  .arow { display: grid; grid-template-columns: 1fr 92px 92px; align-items: center;
    padding: 6px 0 2px; }
  .arow.ahead .acell { font-size: 11px; color: var(--text-muted); text-align: center; }
  .agroup { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted); margin-top: 14px; padding-bottom: 3px;
    border-bottom: 1px solid var(--grid); }
  .aarea { font-size: 13px; color: var(--text-primary); }
  .acell { text-align: center; }
  .abox { display: inline-block; width: 46px; height: 13px; border-radius: 3px;

  .abox.full { background: var(--series-1); }
  .abox.partial { background: var(--series-2); opacity: 0.55; }

    padding: 0 92px 7px 0; margin-top: -1px; max-width: 640px; }
  .jcol { border-top: 2px solid var(--grid); padding-top: 10px; }
  .jcol.good { border-top-color: var(--series-1); }
  .jcol.warn { border-top-color: var(--series-2); }
  .jcol h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .jhead { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-top: 11px; }
  .jbody { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; margin-top: 3px; }
  .timeline.disputes li { padding: 13px 0; align-items: flex-start; }

  .timeline .outcome { display: inline-block; margin-top: 5px; color: var(--text-primary); }
  .timeline .src { display: inline-block; margin-top: 4px; font-size: 11.5px; color: var(--text-muted); }
  .card h4 { font-size: 13px; font-weight: 600; margin-top: 14px; margin-bottom: 2px; }
  table.t td.warnrow { color: var(--text-muted); font-size: 11.5px; line-height: 1.5;

  .timeline li.scope-eu .tbody strong { color: var(--text-secondary); }

  .vlabel { display: block; font-size: 23px; font-weight: 650; letter-spacing: -0.01em;

  .vrow { border-top: 1px solid var(--grid); padding: 11px 0 3px; }
  .vtop { display: flex; align-items: baseline; gap: 9px; }
  .vkey { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .vstatus { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;

  .vstatus.fact { color: var(--text-primary); border-color: var(--baseline); }
  .vhd { font-size: 13.5px; color: var(--text-primary); margin-top: 4px;

  .vnote { font-size: 12px; color: var(--text-muted); line-height: 1.55; margin-top: 4px;

3.8, 33.8, null, null, null], "CHE|DERIVED.NETM.P1000": [4.188, 18.637, 14.855, 10.259, 3.706, -0.231, 2.531, 4.622, 4.257, 3.382, -2.965, 0.424, 3.193, 1.293, 0.317, -9.18, -8.608, -3.585, -1.043, 0.677, 2.823, 3.813, 3.431, 0.882, 1.945, 2.226, 3.573, 4.138, 5.248, 5.18, 8.7, 10.256, 6.111, 5.804, 4.329, 3.6, -0.019, -0.274, 1.593, 3.583, 3.405, 4.899, 6.816, 5.8, 5.343, 4.465, 4.985, 9.598, 12.348, 8.952, 9.762, 8.492, 8.483, 10.362, 9.54, 8.678, 8.48, 5.402, 4.845, 5.191, 6.428, 5.821, 10.986, 5.074, 4.453, 4.097]}, "kpis": [{"label": "GNI per capita (PPP), vs EU average", "delta": "World Bank · not a member, shown against the EU average", "value": "156%"}, {"label": "GNI per capita, PPP", "delta": "current international $ · World Bank", "value": "101,690"}, {"label": "Unemployment (ILO)", "delta": "% of labour force · World Bank", "value": "4.9%"}, {"label": "Trade openness", "delta": "exports + imports, % of GDP · World Bank", "value": "147%"}], "heroChart": {"title": "Income relative to the EU average", "sub": "GNI per capita at purchasing-power parity as a share of the EU-wide average. GNI rather than GDP, because GDP overstates income in economies where a lot of output accrues to non-residents. Switzerland starts higher than any EU member and falls through the period — from 179% of the EU average in 2000 to 156% in 2025. That is mostly the denominator: the EU average itself rose as poorer members caught up. Against the fixed US benchmark on the Overview tab, Switzerland gained 6.5 points rather than losing 23.", "series": [{"code": "DERIVED.GNI.PCT.EU", "name": "Switzerland, % of EU average"}], "opts": {"unit": "%", "dp": 1, "area": true}}, "tabs": {"legal": [{"type": "prose", "title": "Legal", "paras": ["Switzerland took the third road. It rejected the EEA by referendum on 6 December 1992 — by 50.3%, six weeks after signing the agreement — and then spent thirty years building an equivalent relationship one treaty at a time. There are now well over a hundred bilateral agreements, and no single framework binding them together.", "That is the whole argument. The EU has spent a decade trying to attach an institutional framework — dynamic adoption of new law, and a role for the Court of Justice in disputes — to a structure that deliberately has none. Talks on such a framework collapsed on 26 May 2021. A new package was signed on <strong>2 March 2026<\/strong> and is not ratified: parliament is still deciding which referendum threshold applies, and a public vote is not expected before 2028.", "Free movement of persons has applied since <strong>1 June 2002<\/strong> and Schengen since <strong>2008<\/strong>. There is no customs union, no EEA membership and no EFTA Court jurisdiction over the bilateral agreements — which is precisely the gap the framework negotiations were about.", "<em>Detailed legal analysis of which agreements carry which obligations is pending.<\/em>"]}, {"title": "Rule of law", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Both of these countries sit near the top of this scale throughout, which is the headroom problem the governance estimates run into everywhere in this project.", "series": [{"code": "WGI.RL.EST", "name": "Rule of law"}], "opts": {"unit": "", "dp": 2, "zero": true}, "type": "chart"}], "financial": [{"type": "prose", "title": "Financial", "paras": ["The same World Bank series collected for every member state. Two charts that appear on member pages are absent here and cannot be filled in: EU budget flows, because a non-member neither pays into the budget nor receives from it, and the Eurostat long-term bond series, which is a euro-convergence indicator collected for member states only."]}, {"type": "chartRow", "charts": [{"title": "Real GDP growth, %", "sub": "Annual change in real GDP.", "series": [{"code": "NY.GDP.MKTP.KD.ZG", "name": "Real GDP growth"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "Unemployment, % of labour force", "sub": "ILO-modelled estimate.", "series": [{"code": "SL.UEM.TOTL.ZS", "name": "Unemployment"}], "opts": {"unit": "%", "dp": 1}}]}, {"type": "chartRow", "charts": [{"title": "GNI per capita, PPP vs the EU average", "sub": "Current international $. The EU aggregate is available from 1996.", "series": [{"iso3": "EUU", "code": "NY.GNP.PCAP.PP.CD", "name": "EU average", "colorVar": "--series-2"}, {"code": "NY.GNP.PCAP.PP.CD", "name": "Switzerland"}], "opts": {"unit": " $", "dp": 0, "endLabelBelow": 2}}, {"title": "Real income per head, % of the EU average", "sub": "Constant 2015 US$, so this one is not moved by exchange rates or inflation — useful as a cross-check on the headline chart.", "series": [{"code": "DERIVED.KD.PCT.EU", "name": "% of EU average"}], "opts": {"unit": "%", "dp": 1}}]}], "commercial": [{"type": "prose", "title": "Commercial", "paras": ["Trade openness is the outcome this project can establish causally for EU members, and it is also the one where the EEA does most of its work: these countries are inside the single market for goods and services without being inside the Union. Read these lines as the counterfactual the trade estimate is measured against."]}, {"title": "Trade in goods &amp; services, % of GDP", "sub": "Exports and imports of goods and services.", "series": [{"code": "NE.EXP.GNFS.ZS", "name": "Exports"}, {"code": "NE.IMP.GNFS.ZS", "name": "Imports", "colorVar": "--series-2"}], "opts": {"unit": "%", "dp": 1, "endLabelBelow": 2}, "type": "chart"}, {"title": "Who it trades with: the EU's share", "sub": "Share of total exports going to the EU. Coverage for non-EU reporters in the Eurostat dataset begins around 2013, so this is two observations rather than a series — but the level is the point. Non-members are not trading elsewhere; they are trading with the Union, from outside it.", "series": [{"code": "TRADE.EU.EXP.SHR", "name": "Exports to the EU"}], "opts": {"unit": "%", "dp": 1}, "type": "chart"}, {"type": "chartRow", "charts": [{"title": "FDI net inflows, % of GDP", "sub": "Foreign direct investment, net inflows.", "series": [{"code": "BX.KLT.DINV.WD.GD.ZS", "name": "FDI net inflows"}], "opts": {"unit": "%", "dp": 1, "zero": true}}, {"title": "International arrivals, millions", "sub": "World Bank / UNWTO border arrivals. Series generally ends 2019–2020.", "series": [{"code": "ST.INT.ARVL", "name": "Arrivals"}], "opts": {"unit": "m", "dp": 1, "scale": 1e-06}}]}], "political": [{"type": "kpis", "items": [{"label": "EEA referendum: no", "value": "6 Dec 1992", "delta": "50.3% voted against joining the European Economic Area, on a record turnout of 78.7%. French-speaking cantons voted heav"}]}, {"type": "prose", "title": "Political", "paras": ["The verified timeline is on the Overview tab. Rejected the EEA by referendum in 1992 and built a bilateral route instead — more than a hundred separate agreements, renegotiated one at a time.", "The political question here is the mirror of the one every member page asks. A member page asks what joining did. This one asks what staying out did — and that is a counterfactual about a country that never entered, which no comparison of observed outcomes can supply. See the panel at the top of the Overview tab."]}, {"type": "chartRow", "charts": [{"title": "Voice and accountability", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts.", "series": [{"code": "WGI.VA.EST", "name": "Voice and accountability"}], "opts": {"unit": "", "dp": 2, "zero": true}}, {"title": "Control of corruption", "sub": "World Bank governance estimate, roughly −2.5 to +2.5. Aggregated from expert assessments and surveys — perceptions of governance, not a count of legal facts. Higher is better.", "series": [{"code": "WGI.CC.EST", "name": "Control of corruption"}], "opts": {"unit": "", "dp": 2, "zero": true}}]}], "social": [{"type": "prose", "title": "Social", "paras": ["Free movement of people applies here through the EEA and Schengen exactly as it does inside the Union, so the migration series is not measuring a difference in regime."]}, {"title": "Net migration, thousands of people", "sub": "UN World Population Prospects estimates via World Bank. Blue = net inflow, red = net outflow.", "series": [{"code": "SM.POP.NETM", "name": "Net migration"}], "opts": {"type": "bar", "unit": "k", "dp": 1, "zero": true, "scale": 0.001}, "type": "chart"}, {"type": "chartRow", "charts": [{"title": "Income inequality (Gini index)", "sub": "World Bank estimate (0 = perfect equality). Survey-based, so gaps mean no survey rather than no change.", "series": [{"code": "SI.POV.GINI", "name": "Gini index"}], "opts": {"unit": "", "dp": 1}}, {"title": "Net migration per 1,000 residents", "sub": "The same flow scaled by population, which is the comparable form.", "series": [{"code": "DERIVED.NETM.P1000", "name": "Net migration per 1,000"}], "opts": {"unit": "", "dp": 1, "zero": true}}]}]}, "sources": [{"label": "Time series", "text": "World Bank Open Data (api.worldbank.org). Indicator codes travel with every value in <code class=\"ind\">data/indicators.csv<\/code>."}, {"label": "Milestones", "text": "Statistics Norway, the Norwegian Government, the Council of the EU, the European Commission (DG NEAR), EFTA, Iceland's National Electoral Commission and RÚV. The source for each row is recorded in <code class=\"ind\">data/milestones.csv<\/code>, and where two credited sources disagree the row says so rather than picking one."}, {"label": "Relationship metadata", "text": "EEA, Schengen and EFTA status in <code class=\"ind\">data/nonmembers.csv<\/code>."}], "method": [{"title": "Why this page exists", "text": "Switzerland is one of the non-member countries every estimate in this project is measured against. A control group that is never shown is a control group nobody can check."}, {"title": "What        1960 — and a shared window left some charts with decades of blank plot before the
       first point, which is also what made the timeline look like it ran off the end of
       the data. */
    var iA = 0, iB = years.length - 1;
    var empty = function (i) { return series.every(function (s) { return s.values[i] === null || s.values[i] === undefined; }); };
    while (iA <= iB && empty(iA)) iA++;
    while (iB >= iA && empty(iB)) iB--;
    if (iA > iB) { host.appendChild(wrapBox); return; }
    var cY0 = Y0 + iA, cY1 = Y0 + iB;
    var xspan = (cY1 + 0.6) - cY0;
    var xs = function (yr) { return L + (yr - cY0) / xspan * pw; };

    var all = [];
    series.forEach(function (s) { s.values.forEach(function (v) { if (v !== null) all.push(v); }); });
    if (!all.length) { host.appendChild(wrapBox); return; }
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (opts.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    var pad = (hi - lo) * 0.10 || 1;
    lo -= pad; hi += pad;
    var ys = function (v) { return T + (hi - v) / (hi - lo) * ph; };

    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": spec.title.replace(/&amp;/g, "&") });
    if (W_.accession && W_.negotiationsOpen && W_.accession > W_.negotiationsOpen) {
      var ba = Math.max(W_.negotiationsOpen, cY0), bb = Math.min(W_.accession, cY1 + 0.999);
      if (bb > ba) svg.appendChild(el("rect", { x: xs(ba), y: T, width: xs(bb) - xs(ba), height: ph }, "fill:var(--band)"));
    }
    /* Synchronised downturns, so a country's line can be read against the shocks everyone
       faced. The 2011-13 episode is tinted differently because it was European rather than
       global — 61% of EU members contracted in 2012 against 23% of non-members. */
    (P.crises || []).forEach(function (c) {
      var a = Math.max(c.from, cY0), b = Math.min(c.to, cY1);
      if (b < a) return;
      var x1 = xs(a), x2 = xs(b + 0.999);
      svg.appendChild(el("rect", { x: x1, y: T, width: Math.max(2, x2 - x1), height: ph },
        "fill:var(--" + (c.scope === "global" ? "text-muted" : "series-2")
        + ");opacity:" + (c.scope === "global" ? 0.07 : 0.08)));
    });

    niceTicks(lo, hi, 5).forEach(function (tv) {
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: ys(tv), y2: ys(tv) }, "stroke:var(--grid);stroke-width:1"));
      var lab = el("text", { x: L - 7, y: ys(tv) + 3.5, "text-anchor": "end" }, "fill:var(--text-muted);font-size:10.5px;font-variant-numeric:tabular-nums");
      lab.textContent = fmt(tv, tv % 1 ? 1 : 0);
      svg.appendChild(lab);
    });
    if (opts.zero && lo < 0 && hi > 0)
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: ys(0), y2: ys(0) }, "stroke:var(--baseline);stroke-width:1"));

    /* Tick every 2, 4, 5 or 10 years depending on how wide this chart turned out — a
       fixed step that suits a 66-year page leaves a 12-year chart with two labels. */
    var span = cY1 - cY0;
    var step = span > 45 ? 10 : span > 22 ? 5 : span > 11 ? 4 : 2;
    years.forEach(function (yr) {
      if (yr % step !== 0 || yr < cY0 || yr > cY1) return;
      var lab = el("text", { x: xs(yr), y: H - 10, "text-anchor": "middle" }, "fill:var(--text-muted);font-size:10.5px;font-variant-numeric:tabular-nums");
      lab.textContent = yr;
      svg.appendChild(lab);
    });

    if (W_.accession && W_.accession >= cY0 && W_.accession <= cY1) {
      svg.appendChild(el("line", { x1: xs(W_.accession), x2: xs(W_.accession), y1: T, y2: T + ph }, "stroke:var(--baseline);stroke-width:1"));
      var al = el("text", { x: xs(W_.accession) + 5, y: T + 11 }, "fill:var(--text-muted);font-size:10px");
      al.textContent = W_.accessionLabel || "EU entry";
      svg.appendChild(al);
    }
    if (W_.eea && W_.eea >= cY0 && W_.eea <= cY1) {
      svg.appendChild(el("line", { x1: xs(W_.eea), x2: xs(W_.eea), y1: T, y2: T + ph }, "stroke:var(--baseline);stroke-width:1"));
      var el2 = el("text", { x: xs(W_.eea) + 5, y: T + 11 }, "fill:var(--text-muted);font-size:10px");
      el2.textContent = W_.eeaLabel || "EEA";
      svg.appendChild(el2);
    }
    if (W_.exit && W_.exit >= cY0 && W_.exit <= cY1) {
      svg.appendChild(el("line", { x1: xs(W_.exit), x2: xs(W_.exit), y1: T, y2: T + ph }, "stroke:var(--neg);stroke-width:1"));
      var xl = el("text", { x: xs(W_.exit) - 5, y: T + 11, "text-anchor": "end" }, "fill:var(--neg);font-size:10px;font-weight:600");
      xl.textContent = W_.exitLabel || "Exit";
      svg.appendChild(xl);
    }

    if (opts.type === "bar") {
      var s0 = series[0], bw = Math.min(14, pw / years.length * 0.62);
      s0.values.forEach(function (v, i) {
        if (v === null) return;
        var x = xs(Y0 + i) - bw / 2, y0 = ys(0), y1 = ys(v);
        var top = Math.min(y0, y1), hh = Math.abs(y0 - y1), r = Math.min(4, hh / 2, bw / 2), up = v >= 0, d;
        if (up) d = "M" + x + "," + (top + hh) + " L" + x + "," + (top + r) + " Q" + x + "," + top + " " + (x + r) + "," + top +
          " L" + (x + bw - r) + "," + top + " Q" + (x + bw) + "," + top + " " + (x + bw) + "," + (top + r) + " L" + (x + bw) + "," + (top + hh) + " Z";
        else d = "M" + x + "," + top + " L" + (x + bw) + "," + top + " L" + (x + bw) + "," + (top + hh - r) +
          " Q" + (x + bw) + "," + (top + hh) + " " + (x + bw - r) + "," + (top + hh) + " L" + (x + r) + "," + (top + hh) +
          " Q" + x + "," + (top + hh) + " " + x + "," + (top + hh - r) + " Z";
        svg.appendChild(el("path", { d: d }, "fill:var(" + (up ? s0.colorVar : "--neg") + ")"));
      });
      var vals = s0.values.filter(function (v) { return v !== null; });
      var mx = s0.values.indexOf(Math.max.apply(null, vals));
      var lbl = el("text", { x: Math.min(xs(Y0 + mx) + 6, W - R), y: ys(s0.values[mx]) + 2, "text-anchor": "end" },
        "fill:var(--text-primary);font-size:11px;font-weight:600");
      lbl.textContent = "+" + fmt(s0.values[mx], 0) + (opts.unit || "") + (opts.peakLabel ? " (" + opts.peakLabel + ")" : "");
      svg.appendChild(lbl);
    } else {
      var endYs = [];
      series.forEach(function (s, si) {
        var d = "", pen = false;
        s.values.forEach(function (v, i) {
          if (v === null) { pen = false; return; }
          d += (pen ? " L" : " M") + xs(Y0 + i).toFixed(1) + "," + ys(v).toFixed(1);
          pen = true;
        });
        if (opts.area) {
          var li0 = 0; while (s.values[li0] === null) li0++;
          var li1 = s.values.length - 1; while (s.values[li1] === null) li1--;
          svg.appendChild(el("path", { d: d + " L" + xs(Y0 + li1).toFixed(1) + "," + (T + ph) + " L" + xs(Y0 + li0).toFixed(1) + "," + (T + ph) + " Z" },
            "fill:var(" + s.colorVar + ");opacity:0.10"));
        }
        svg.appendChild(el("path", { d: d, fill: "none" }, "stroke:var(" + s.colorVar + ");stroke-width:2;stroke-linejoin:round;stroke-linecap:round"));
        var li = s.values.length - 1; while (s.values[li] === null) li--;
        svg.appendChild(el("circle", { cx: xs(Y0 + li), cy: ys(s.values[li]), r: 4 }, "fill:var(" + s.colorVar + ");stroke:var(--surface-1);stroke-width:2"));
        var below = opts.endLabelBelow && si === (opts.endLabelBelow - 1);
        var ey = ys(s.values[li]) + (below ? 16 : -9);
        /* Two series ending a few hundred euros apart print their end labels on top of one
           another and neither is readable. Push any label that lands within 12px of one
           already placed clear of it, in whichever direction its own line is heading. */
        endYs.forEach(function (prev) {
          while (Math.abs(ey - prev) < 12) ey += (ey >= prev ? 12 : -12);
        });
        endYs.push(ey);
        var elab = el("text", { x: xs(Y0 + li) - 8, y: ey, "text-anchor": "end" },
          "fill:var(" + s.colorVar + ");font-size:11px;font-weight:600");
        elab.textContent = fmt(s.values[li], opts.dp) + (opts.unit === "%" ? "%" : "");
        svg.appendChild(elab);
      });
    }

    /* ---- milestone rail ----
       A line bending in 2004 means one thing if that is the year the country joined and
       another if it is the year the euro arrived. The rail puts both on the chart: this
       country's own events in the accent colour, the Union-wide ones every member lived
       through in grey. Only the country's own events get a vertical guide, because
       fourteen full-height lines would be noise rather than context. */
    var msHere = showMs ? (P.milestones || []).filter(function (m) {
      return m.sort >= cY0 && m.sort <= cY1 + 0.999;
    }) : [];
    var msLock = false;
    if (msHere.length) {
      var railY = T + ph + 13;
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: railY, y2: railY },
        "stroke:var(--grid);stroke-width:1"));
      msHere.forEach(function (m) {
        var x = xs(m.sort);
        if (m.scope === "country")
          svg.appendChild(el("line", { x1: x, x2: x, y1: T, y2: T + ph },
            "stroke:var(--series-1);stroke-width:1;stroke-dasharray:2 4;opacity:0.42"));
        var dot = el("circle", { cx: x, cy: railY, r: m.scope === "dispute" ? 4.2 : 3.6 },
          "fill:var(" + (m.scope === "country" ? "--series-1"
                       : m.scope === "dispute" ? "--neg" : "--text-muted") + ");"
          + "stroke:var(--surface-1);stroke-width:1.5;cursor:pointer");
        dot.addEventListener("pointerenter", function () {
          msLock = true;
          cross.style.display = "none";
          hitDots.forEach(function (c) { c.style.display = "none"; });
          while (tt.firstChild) tt.removeChild(tt.firstChild);
          var t1 = h("div", "tt-title");
          t1.textContent = m.date + (m.scope === "eu" ? " · EU-wide"
            : m.scope === "dispute" ? " · point of contention" : "");
          tt.appendChild(t1);
          var t2 = h("div", "tt-ms");
          t2.innerHTML = "<strong>" + m.label + "</strong> — " + m.description;
          tt.appendChild(t2);
          tt.style.display = "block";
          var rect = root.getBoundingClientRect(), px = (x / W) * rect.width;
          var left = px + 12;
          if (left + tt.offsetWidth > rect.width - 4) left = px - tt.offsetWidth - 12;
          tt.style.left = Math.max(2, left) + "px";
          tt.style.top = "14px";
        });
        dot.addEventListener("pointerleave", function () { msLock = false; tt.style.display = "none"; });
        svg.appendChild(dot);
      });
      var rl = el("text", { x: L - 7, y: railY + 3.5, "text-anchor": "end" },
        "fill:var(--text-muted);font-size:9.5px");
      rl.textContent = "events";
      svg.appendChild(rl);
    }

    var cross = el("line", { x1: 0, x2: 0, y1: T, y2: T + ph }, "stroke:var(--baseline);stroke-width:1;display:none");
    svg.appendChild(cross);
    var hitDots = series.map(function (s) {
      var c = el("circle", { r: 5 }, "fill:var(" + s.colorVar + ");stroke:var(--surface-1);stroke-width:2;display:none");
      svg.appendChild(c); return c;
    });
    root.appendChild(svg);
    var tt = h("div", "tooltip");
    root.appendChild(tt);

    function showAt(i) {
      var yr = Y0 + i;
      cross.setAttribute("x1", xs(yr)); cross.setAttribute("x2", xs(yr));
      cross.style.display = "";
      while (tt.firstChild) tt.removeChild(tt.firstChild);
      var t1 = h("div", "tt-title"); t1.textContent = yr; tt.appendChild(t1);
      series.forEach(function (s, si) {
        var v = s.values[i];
        if (opts.type !== "bar") {
          if (v === null) hitDots[si].style.display = "none";
          else { hitDots[si].setAttribute("cx", xs(yr)); hitDots[si].setAttribute("cy", ys(v)); hitDots[si].style.display = ""; }
        }
        var row = h("div", "tt-row");
        var key = h("span", "tt-key");
        key.style.background = (opts.type === "bar" && v !== null && v < 0) ? "var(--neg)" : "var(" + s.colorVar + ")";
        var val = h("span", "tt-val");
        val.textContent = v === null ? "no data" : fmt(v, opts.dp) + (opts.unit || "");
        var nm = h("span", "tt-name"); nm.textContent = s.name;
        row.appendChild(key); row.appendChild(val); row.appendChild(nm);
        tt.appendChild(row);
      });
      tt.style.display = "block";
      var rect = root.getBoundingClientRect();
      var px = (xs(yr) / W) * rect.width;
      var left = px + 12;
      if (left + tt.offsetWidth > rect.width - 4) left = px - tt.offsetWidth - 12;
      tt.style.left = Math.max(2, left) + "px";
      tt.style.top = "14px";
    }
    function hide() {
      cross.style.display = "none"; tt.style.display = "none";
      hitDots.forEach(function (c) { c.style.display = "none"; });
    }
    svg.addEventListener("pointermove", function (ev) {
      if (msLock) return;
      var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      var m = svg.getScreenCTM(); if (!m) return;
      var loc = pt.matrixTransform(m.inverse());
      var i = iA + Math.round((loc.x - L) / pw * xspan);
      showAt(Math.max(iA, Math.min(iB, i)));
    });
    svg.addEventListener("pointerleave", function () { msLock = false; hide(); });

    var det = h("details", "data-table");
    var sum = document.createElement("summary"); sum.textContent = "View data table"; det.appendChild(sum);
    var tbl = document.createElement("table");
    var thr = document.createElement("tr");
    var th0 = document.createElement("th"); th0.textContent = "Year"; thr.appendChild(th0);
    series.forEach(function (s) {
      var th = document.createElement("th");
      th.textContent = s.name + (opts.unit ? " (" + opts.unit.trim() + ")" : "");
      thr.appendChild(th);
    });
    tbl.appendChild(thr);
    years.forEach(function (yr, i) {
      if (i < iA || i > iB) return;
      var tr = document.createElement("tr");
      var td0 = document.createElement("td"); td0.textContent = yr; tr.appendChild(td0);
      series.forEach(function (s) {
        var td = document.createElement("td");
        td.textContent = s.values[i] === null || s.values[i] === undefined ? "–" : fmt(s.values[i], opts.dp);
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    det.appendChild(tbl);
    wrapBox.appendChild(det);
    host.appendChild(wrapBox);
  }

  // ---------------- card builders ----------------
  function chartCard(spec) {
    var card = h("div", "card");
    card.appendChild(h("h3", null, spec.title));
    if (spec.sub) card.appendChild(h("p", "sub", spec.sub));
    renderChart(card, spec);
    return card;
  }
  function proseCard(spec) {
    var card = h("div", "card prose");
    card.appendChild(h("h3", null, spec.title));
    (spec.paras || []).forEach(function (t) { card.appendChild(h("p", null, t)); });
    if (spec.note) card.appendChild(h("p", "note", spec.note));

  }
  function kpiRow(items) {
    var row = h("div", "kpis");

      var t = h("div", "tile");

  }
  /* ---------------- does this country gain? ----------------
     Three channels, reported separately because they are not established to the same
     standard and netting them into one score would erase exactly the distinction this
     project exists to make. The headline is a stated rule applied to the three, not a
     judgement. */
  function verdictCard() {
    var V = P.verdict;
    if (!V) return null;
    var card = h("div", "card verdict " + V.tone);
    card.appendChild(h("h3", null, V.question
      || "Does the data suggest this country gains from membership?"));
    var band = h("div", "vhead");
    band.appendChild(h("span", "vlabel", V.label));
    band.appendChild(h("span", "vgist", V.gist));

    V.channels.forEach(function (c) {
      var row = h("div", "vrow " + c.verdict);
      var top = h("div", "vtop");
      top.appendChild(h("span", "vkey", c.key));
      top.appendChild(h("span", "vstatus " + c.status.replace(/ /g, "-"), c.status));
      row.appendChild(top);

      + "in this dataset at all. Market access, freedom of movement, a common regulatory "

      + "absent. A verdict drawn from three measured channels is a verdict about three "
      + "measured channels."));

  }

  /* ---------------- the budget, in and out ---------------- */
  function moneyCard(full) {
    var M = P.money;
    if (!M) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "What it pays in, and what comes back"));
    card.appendChild(h("p", "sub", "Cumulative " + M.since + "–" + M.to
      + ", from the European Commission's budget workbook. Accounting rather than "
      + "estimation — reconciled to the Commission's own published totals. "
      + "<a href=\"flows.html\">Full breakdown for every member state →</a>"));

    var row = h("div", "kpis");
    [["Paid in", "€" + fmt(M.cumOut, 1) + "bn",
      M.perHeadOut === null ? "" : "€" + fmt(M.perHeadOut, 0) + " per person a year"],
     ["Received", "€" + fmt(M.cumIn, 1) + "bn",
      M.perHeadIn === null ? "" : "€" + fmt(M.perHeadIn, 0) + " per person a year"],
     [M.net >= 0 ? "Net receipt" : "Net contribution",
      "€" + fmt(Math.abs(M.net), 1) + "bn",
      (M.pctGniNet === null ? "" : fmt(Math.abs(M.pctGniNet), 2)
        + "% of national income a year")]
    ].forEach(function (k, i) {
      var t = h("div", "tile");
      t.appendChild(h("div", "label", k[0]));
      var v = h("div", "value"); v.textContent = k[1];
      if (i === 2) v.style.color = M.net >= 0 ? "var(--series-1)" : "var(--series-2)";
      t.appendChild(v);
      if (k[2]) t.appendChild(h("div", "delta", k[2]));
      row.appendChild(t);
    });
    card.appendChild(row);

    /* Two bars on one scale: the comparison is the point, and stacking the funds inside
       shows at a glance whether a country's receipts are farm money, cohesion money or
       research money without needing a second chart. */
    var COL = ["#2a78d6", "#5faf7e", "#5aa9a2", "#9cbb52", "#d0ae5c", "#d99a68",
               "#cf8a86", "#b58aa8", "#948fbd", "#7b93c9", "#8a8f9c", "#4f9fc9",
               "#7ab55f", "#bcbb54", "#c9a878"];
    var OCOL = ["#eb6834", "#e08246", "#d59a5e", "#c9a878", "#b0a894"];
    var inP = M.receipts.map(function (r, i) { return { name: r.label, v: r.v, c: COL[i % COL.length] }; });
    var outP = M.payments.filter(function (r) { return r.v > 0; })
      .map(function (r, i) { return { name: r.label, v: r.v, c: OCOL[i % OCOL.length] }; });
    var inPos = inP.reduce(function (a, p) { return a + p.v; }, 0);
    var outPos = outP.reduce(function (a, p) { return a + p.v; }, 0);

    [["Received", inP, inPos, M.cumIn, 14], ["Paid in", outP, outPos, M.cumOut, 66]].forEach(function (r) {
      var lab = el("text", { x: Lb - 10, y: r[4] + 21, "text-anchor": "end" }, "fill:var(--text-secondary);font-size:12.5px");
      lab.textContent = r[0]; svgb.appendChild(lab);
      var run = 0;
      r[1].forEach(function (p) {
        var seg = p.v / mx * pwb;
        if (seg <= 0) return;
        var rect = el("rect", { x: Lb + run, y: r[4], width: seg, height: 32 },
          "fill:" + p.c + ";stroke:var(--surface-1);stroke-width:0.8");
        rect.addEventListener("pointerenter", function () {
          while (ttb.firstChild) ttb.removeChild(ttb.firstChild);
          var a = h("div", "tt-title"); a.textContent = p.name; ttb.appendChild(a);
          var b = h("div", "tt-val"); b.textContent = "€" + fmt(p.v, 1) + "bn"; ttb.appendChild(b);
          ttb.style.display = "block"; ttb.style.left = "12px"; ttb.style.top = "4px";
        });
        rect.addEventListener("pointerleave", function () { ttb.style.display = "none"; });
        svgb.appendChild(rect);
        if (seg > 46) {
          var t = el("text", { x: Lb + run + seg / 2, y: r[4] + 21, "text-anchor": "middle" },
            "fill:#fff;font-size:11px;font-weight:600;pointer-events:none;font-variant-numeric:tabular-nums");
          t.textContent = fmt(p.v, p.v >= 100 ? 0 : 1); svgb.appendChild(t);
        }
        run += seg;
      });
      var tot = el("text", { x: Lb + r[2] / mx * pwb + 7, y: r[4] + 21 },
        "fill:var(--text-primary);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums");
      tot.textContent = "€" + fmt(r[3], 1) + "bn"; svgb.appendChild(tot);
    });
    rootb.appendChild(svgb); rootb.appendChild(ttb);
    card.appendChild(rootb);

    var lg = h("div", "legend");
    inP.concat(outP).forEach(function (p) {
      var k = h("span", "key");
      var sw = h("span", "swatch-line");
      sw.style.background = p.c; sw.style.height = "10px"; sw.style.width = "10px"; sw.style.borderRadius = "2px";
      k.appendChild(sw); k.appendChild(document.createTextNode(p.name));
      lg.appendChild(k);
    });
    card.appendChild(lg);

    if (full) {
      var det = h("details", "data-table");
      var su = document.createElement("summary"); su.textContent = "Every fund and revenue source";
      det.appendChild(su);
      var tb = document.createElement("table");
      var hr = document.createElement("tr");
      ["Line", "€bn", "Share"].forEach(function (x) {
        var th = document.createElement("th"); th.textContent = x; hr.appendChild(th);
      });
      tb.appendChild(hr);
      [["Received", M.receipts, M.cumIn], ["Paid in", M.payments, M.cumOut]].forEach(function (grp) {
        var hd = document.createElement("tr");
        var td = document.createElement("td"); td.colSpan = 3;
        td.style.fontWeight = "600"; td.style.color = "var(--text-primary)";
        td.textContent = grp[0]; hd.appendChild(td); tb.appendChild(hd);
        grp[1].forEach(function (r) {
          var tr = document.createElement("tr");
          [r.label, fmt(r.v, 1), fmt(r.v / grp[2] * 100, 1) + "%"].forEach(function (c) {
            var d2 = document.createElement("td"); d2.textContent = c; tr.appendChild(d2);
          });
          tb.appendChild(tr);
        });
      });
      det.appendChild(tb);
      card.appendChild(det);
      card.appendChild(h("p", "note", "“Received” is EU spending allocated to this "
        + "country, not a payment to its government: a research grant to a university, a farm "
        + "payment to a landowner and a co-financed road all count. “Paid in” includes "
        + "customs duties collected at the external border, which the Commission treats as the "
        + "Union's own revenue and leaves out of its headline figure. Nominal euros."));
    }
    return card;
  }

  /* ---------------- what a non-member pays and gets back ----------------
     There is no budget workbook for a country outside the Union, and the absence is the
     point: nobody publishes an audited net position for a non-member. The rows below are
     what IS published, on the basis each source publishes it, and they are deliberately
     not summed. */
  function flowsCard() {
    var F = P.flows;
    if (!F) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "What it pays the Union, and what it gets back"));
    card.appendChild(h("p", "sub", "A non-member has no seat in the EU budget, so there is no "
      + "equivalent of the Commission workbook that every member page draws on. What follows is "
      + "each figure as its own source publishes it."));

    function tbl(rows, heading) {
      if (!rows.length) return;
      card.appendChild(h("h4", null, heading));
      var t = h("table", "t");
      var hr = document.createElement("tr");
      ["Item", "Amount", "Basis", "Period"].forEach(function (x, j) {
        var th = document.createElement("th"); if (j === 1) th.className = "num";
        th.textContent = x; hr.appendChild(th);
      });
      t.appendChild(hr);
      rows.forEach(function (r) {
        var tr = document.createElement("tr");
        var unit = r.currency.split(" ");          // "EUR m" -> ["EUR","m"]
        var amt = (unit[0] === "%")
          ? r.amount + "%"
          : unit[0] + " " + Number(r.amount).toLocaleString("en-US") + (unit[1] || "");
        [[r.label, "nm"], [amt, "num"], [r.basis, ""], [r.period, ""]]
          .forEach(function (c) {
            var td = document.createElement("td"); td.className = c[1];
            td.textContent = c[0]; tr.appendChild(td);
          });
        t.appendChild(tr);
        var d = document.createElement("tr");
        var dt = document.createElement("td"); dt.colSpan = 4; dt.className = "warnrow";
        dt.textContent = r.detail + " — " + r.source;
        d.appendChild(dt); t.appendChild(d);
      });
      card.appendChild(t);
    }
    tbl(F.out, "Paid");
    tbl(F["in"], "Received");

    card.appendChild(h("p", "note", "<strong>These are not added up, and that is deliberate.</strong> "
      + "They sit on different bases — some are annual averages, some are totals for a whole "
      + "funding period, and two currencies are involved. No institution publishes a single "
      + "audited net position for a non-member the way the Commission does for a member state, "
      + "and constructing one here by summing across bases would produce a number that looks "
      + "authoritative and is not. The comparison a reader wants — what this country pays "
      + "against what a member of the same size pays — cannot be made from published figures "
      + "at the standard this project holds itself to."));
    return card;
  }

  /* ---------------- where the Union and this country were on opposite sides ---------------- */
  function disputesCard() {
    var D = P.disputes || [];
    if (!D.length) return null;
    var card = h("div", "card prose");
    card.appendChild(h("h3", null, "Points of contention"));
    card.appendChild(h("p", "sub", "Dated episodes where this country and the Union, or member "
      + "states acting through EU law, were on opposite sides — financial, legal or commercial. "
      + "Each one has an outcome, and the outcome is not always the Union's."));
    var ul = h("ul", "timeline disputes");
    D.forEach(function (d) {
      var li = document.createElement("li");
      li.className = "scope-dispute";
      li.appendChild(h("span", "tdate", d.date));
      li.appendChild(h("span", "tl-dot warn"));
      var body = h("span", "tbody");
      body.innerHTML = "<strong>" + d.label + "</strong> <span class=\"tag\">" + d.arena
        + "</span><br>" + d.description
        + "<br><span class=\"outcome\"><strong>Outcome.</strong> " + d.outcome + "</span>"
        + "<br><span class=\"src\">" + d.source + "</span>";
      li.appendChild(body);
      ul.appendChild(li);
    });
    card.appendChild(ul);
    return card;
  }

  /* ---------------- the overlap, drawn ----------------
     "How much EU law applies?" has no honest single number — the counts depend entirely on
     what you count, and EFTA's own tracker puts more than 9,500 acts as having been part of
     the EEA Agreement at some point with around 5,000 in force. So this draws the map
     instead: which policy areas are inside the arrangement, which are half in, which are out. */
  function acquisCard() {
    var A = P.acquis;
    if (!A) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "How much of the Union's rulebook already applies"));
    card.appendChild(h("p", "sub", "Each row is a policy area. The left column is an EU member "
      + "state, the right is this country. <strong>" + A.counts + ".</strong>"));

    var lg = h("div", "legend");
    [["applies in full", "var(--series-1)"], ["applies in part", "var(--series-2)"],
     ["does not apply", "var(--grid)"]].forEach(function (k) {
      var e = h("span", "key");
      var i = h("span", "swatch-line");
      i.style.background = k[1]; i.style.width = "11px"; i.style.height = "11px";
      i.style.borderRadius = "2px";
      e.appendChild(i); e.appendChild(document.createTextNode(k[0]));
      lg.appendChild(e);
    });
    card.appendChild(lg);

    var grid = h("div", "acquis");
    var hd = h("div", "arow ahead");
    hd.appendChild(h("span", "aarea", ""));
    hd.appendChild(h("span", "acell", "EU member"));
    hd.appendChild(h("span", "acell", P.name));
    grid.appendChild(hd);
    var seen = {};
    A.rows.forEach(function (r) {
      if (!seen[r.group]) {
        seen[r.group] = 1;
        grid.appendChild(h("div", "agroup", r.group));
      }
      var row = h("div", "arow");
      var nm = h("span", "aarea", r.area);
      row.appendChild(nm);
      [r.eu, r.here].forEach(function (v) {
        var c = h("span", "acell");
        var box = h("span", "abox " + v);
        box.title = v === "full" ? "applies in full"
          : v === "partial" ? "applies in part" : "does not apply";
        c.appendChild(box);
        row.appendChild(c);
      });
      grid.appendChild(row);
      if (r.note) grid.appendChild(h("div", "anote", r.note));
    });
    card.appendChild(grid);
    card.appendChild(h("p", "note", "Built from the structure of the agreements themselves — "
      + "the EEA Agreement's annexes and the Swiss bilateral packages — rather than from a "
      + "percentage. The often-quoted figures for “how much EU law Norway has adopted” vary "
      + "wildly because they depend on what is being counted; EFTA's own tracker records more "
      + "than 9,500 acts as having been part of the EEA Agreement at some point, with around "
      + "5,000 in force. A map is more honest than a number. Sources: European Parliament "
      + "research service briefing on EU–Norway relations (2025), the EEA Agreement, EFTA and "
      + "the Swiss Federal Department of Foreign Affairs."));
    return card;
  }

  /* ---------------- what joining would actually change ---------------- */
  function joiningCard() {
    var J = P.joining;
    if (!J) return null;
    var card = h("div", "card");
    card.appendChild(h("h3", null, "Where membership would change something, and where it would cost"));
    card.appendChild(h("p", "sub", "Derived from the coverage map above: an area that already "
      + "applies in full would not change on joining, and one that applies partly or not at all "
      + "would. What follows is what would change — not whether it would be worth it."));
    var g = h("div", "grid2");
    [["What it would gain", J.gains, "good"], ["What it would give up", J.costs, "warn"]]
      .forEach(function (side) {
        var col = h("div", "jcol " + side[2]);
        col.appendChild(h("h4", null, side[0]));
        side[1].forEach(function (x) {
          col.appendChild(h("div", "jhead", x.head));
          col.appendChild(h("div", "jbody", x.body));
        });
        g.appendChild(col);
      });
    card.appendChild(g);
    card.appendChild(h("p", "note", J.verdictNote));
    return card;
  }

  function buildBlocks(host, blocks) {
    blocks.forEach(function (b) {
      if (b.type === "prose") host.appendChild(proseCard(b));
      else if (b.type === "kpis") host.appendChild(kpiRow(b.items));
      else if (b.type === "chart") host.appendChild(chartCard(b));
      else if (b.type === "chartRow") {
        var g = h("div", "grid2");
        b.charts.forEach(function (c) { g.appendChild(chartCard(c)); });
        if (b.prose) g.appendChild(proseCard(b.prose));
        host.appendChild(g);
      }
    });
  }

  // ---------------- panels ----------------
  var TABS = [
    { id: "overview", label: "Overview" },
    { id: "legal", label: "Legal" },
    { id: "financial", label: "Financial" },
    { id: "commercial", label: "Commercial" },
    { id: "political", label: "Political" },
    { id: "social", label: "Social" },
    { id: "sources", label: "Sources & method" }
  ];
  var tabsEl = document.getElementById("tabs"), panelsEl = document.getElementById("panels");

  TABS.forEach(function (t, i) {
    var b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.dataset.tab = t.id;
    b.textContent = t.label;
    tabsEl.appendChild(b);

    var sec = h("section", "panel" + (i === 0 ? " active" : ""));
    sec.id = "panel-" + t.id;
    panelsEl.appendChild(sec);

    if (t.id === "overview") {
      sec.appendChild(kpiRow(P.kpis));
      var vc = verdictCard(); if (vc) sec.appendChild(vc);
      sec.appendChild(chartCard(P.heroChart));
      var mnc = moneyCard(false); if (mnc) sec.appendChild(mnc);
      var fc = flowsCard(); if (fc) sec.appendChild(fc);
      var dc = disputesCard(); if (dc) sec.appendChild(dc);
      var ac = acquisCard(); if (ac) sec.appendChild(ac);
      var jc = joiningCard(); if (jc) sec.appendChild(jc);
      if ((P.context || []).length) {
        var cc = h("div", "card prose");
        cc.appendChild(h("h3", null, "Where this country sits in the wider findings"));
        cc.appendChild(h("p", "sub", "Drawn from the cross-country analysis rather than "
          + "written for this page. <a href=\"analysis.html\">The full argument →</a>"));
        P.context.forEach(function (c) {
          cc.appendChild(h("p", null, "<strong>" + c.title + ".</strong> " + c.text));
        });
        sec.appendChild(cc);
      }
      var mc = h("div", "card");
      mc.appendChild(h("h3", null, "Milestones at a glance"));
      mc.appendChild(h("p", "sub", "This country's own events, and the Union-wide ones it "
        + "lived through. The same events are marked on the rail under every chart, so a "
        + "bend in a line can be read against what happened that year. It starts in "
        + P.window.start + ", the first year any chart on this page has data for; anything "
        + "earlier is listed at the foot of the list rather than plotted against nothing."));
      var lgm = h("div", "legend");
      var lgk = [["--series-1", "This country"], ["--text-muted", "EU-wide"]];
      if ((P.disputes || []).length) lgk.push(["--neg", "Point of contention"]);
      lgk.forEach(function (k) {
        var key = h("span", "key");
        var sw = h("span", "swatch-line");
        sw.style.background = "var(" + k[0] + ")";
        sw.style.height = "9px"; sw.style.width = "9px"; sw.style.borderRadius = "50%";
        key.appendChild(sw); key.appendChild(document.createTextNode(k[1]));
        lgm.appendChild(key);
      });
      mc.appendChild(lgm);
      var ul = h("ul", "timeline");
      P.milestones.filter(function (m) { return m.scope !== "dispute"; }).forEach(function (m) {
        var li = document.createElement("li");
        li.className = (m.kind === "era" ? "era " : "") + "scope-" + m.scope;
        li.appendChild(h("span", "tdate", m.date));
        li.appendChild(h("span", "tl-dot" + (m.kind === "warn" ? " warn" : "")
          + (m.scope === "eu" ? " eu" : "")));
        li.appendChild(h("span", "tbody", "<strong>" + m.label + "</strong> — " + m.description
          + (m.scope === "eu" ? " <span class=\"tag\">EU-wide</span>" : "")));
        ul.appendChild(li);
      });
      mc.appendChild(ul);
      if ((P.milestonesDropped || []).length) {
        mc.appendChild(h("p", "note", (P.milestonesDropped.length === 1 ? "One earlier event falls"
          : P.milestonesDropped.length + " earlier events fall")
          + " outside the range this page has data for and are not listed: "
          + P.milestonesDropped.map(function (d) { return d.label + " (" + d.date + ")"; }).join("; ")
          + "."));
      }
      sec.appendChild(mc);
    } else if (t.id === "financial") {
      var fm = moneyCard(true); if (fm) sec.appendChild(fm);
      buildBlocks(sec, P.tabs[t.id] || []);
    } else if (t.id === "sources") {
      var sc = h("div", "card prose");
      sc.appendChild(h("h3", null, "Sources"));
      var sl = h("div", "src-list");
      P.sources.forEach(function (s) { sl.appendChild(h("p", null, "<strong>" + s.label + "</strong> — " + s.text)); });
      sc.appendChild(sl);
      sec.appendChild(sc);
      var mcd = h("div", "card prose");
      mcd.appendChild(h("h3", null, "Method &amp; confidence notes"));
      P.method.forEach(function (m) { mcd.appendChild(h("p", null, "<strong>" + m.title + ".</strong> " + m.text)); });
      sec.appendChild(mcd);
    } else {
      buildBlocks(sec, P.tabs[t.id] || []);
    }
  });

  tabsEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    tabsEl.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
    panelsEl.querySelectorAll("section.panel").forEach(function (p) { p.classList.remove("active"); });
    document.getElementById("panel-" + b.dataset.tab).classList.add("active");
  });

  var modes = ["auto", "light", "dark"], mi = 0, btn = document.getElementById("themeBtn");
  btn.addEventListener("click", function () {
    mi = (mi + 1) % 3;
    var m = modes[mi];
    if (m === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", m);
    btn.textContent = "Theme: " + m;
  });
})();
</script>
</body>
</html>
